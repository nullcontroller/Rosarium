name: Scheduled AI essence publication
on:
  schedule:
    # No part of the release job is allowed to start before the approved time.
    - cron: '0 22 24 11 *'
    - cron: '10 22 24 11 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-essence-publication-20261125
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reservation, immutable PR and unchanged production base
        id: reservation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.github/releases/ai-essence-reservation.json'));
            const now = Date.now();
            // Consume the reservation before any validation: a failure must not retry.
            if (now >= Date.parse('2026-11-24T22:00:00Z')) await github.rest.actions.disableWorkflow({...context.repo, workflow_id:'release-ai-essence.yml'});
            if (now < Date.parse('2026-11-24T22:00:00Z') || now > Date.parse('2026-11-24T22:50:00Z')) {
              core.setFailed('Outside the one-time reservation window; no publication performed.'); return;
            }
            const args = {...context.repo, pull_number: config.pr};
            const {data: pr} = await github.rest.pulls.get(args);
            if (pr.merged) { core.notice('Already merged; no duplicate execution.'); return; }
            if (pr.state !== 'open' || pr.draft || pr.head.sha !== config.head || pr.base.ref !== 'master' || pr.mergeable !== true || pr.mergeable_state !== 'clean') throw Error('PR changed, conflicts, or merge is not clean.');
            const {data: baseRef} = await github.rest.git.getRef({...context.repo,ref:'heads/master'});
            const base = baseRef.object.sha;
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead: `${config.base}...${base}`});
            const allowed = ['.github/workflows/deploy-pages.yml','.github/workflows/release-ai-essence.yml','.github/releases/ai-essence-reservation.json'];
            if (!comparison.files || comparison.files.some(f => !allowed.includes(f.filename))) throw Error('Production base changed outside reservation setup; review required.');
            core.setOutput('run','true'); core.setOutput('head',config.head); core.setOutput('base',base);
      - uses: actions/checkout@v4
        if: steps.reservation.outputs.run == 'true'
        with:
          ref: ${{ steps.reservation.outputs.head }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.reservation.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Recheck approved release before merge
        if: steps.reservation.outputs.run == 'true'
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          node scripts/verify-ai-essence-release.mjs
      - name: Wait for approved time and merge the exact reviewed head
        id: merge
        if: steps.reservation.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD: ${{ steps.reservation.outputs.head }}
          EXPECTED_BASE: ${{ steps.reservation.outputs.base }}
        with:
          script: |
            const target = Date.parse('2026-11-24T22:00:00Z');
            while (Date.now() < target) await new Promise(resolve => setTimeout(resolve, Math.min(30000,target-Date.now())));
            if (Date.now() > Date.parse('2026-11-24T22:50:00Z')) throw Error('Reservation expired; manual review required.');
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:35});
            if (pr.merged) { core.notice('Already merged; no deployment requested.'); return; }
            const {data: baseRef} = await github.rest.git.getRef({...context.repo,ref:'heads/master'});
            if (pr.head.sha !== process.env.EXPECTED_HEAD || baseRef.object.sha !== process.env.EXPECTED_BASE || pr.mergeable !== true || pr.mergeable_state !== 'clean') throw Error('PR/base changed after validation.');
            const {data: result} = await github.rest.pulls.merge({...context.repo,pull_number:35,sha:process.env.EXPECTED_HEAD,merge_method:'merge'});
            if (!result.merged) throw Error(result.message);
            core.setOutput('merged','true'); core.setOutput('sha',result.sha);
            await core.summary.addHeading('Scheduled publication').addRaw(`Merged PR #35 at ${new Date().toISOString()} / ${result.sha}`).write();
  deploy:
    needs: release
    if: needs.release.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_ref: ${{ needs.release.outputs.sha }}
  verify-production:
    needs: [release, deploy]
    if: needs.release.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify local artifacts and live production after CDN propagation
        run: |
          npm run build
          node scripts/verify-ai-essence-release.mjs
          for attempt in $(seq 1 15); do
            if node scripts/verify-ai-essence-release.mjs --live; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Record result
        if: always()
        run: echo 'Production verification result is recorded in this workflow run. A failure requires manual investigation; automatic republication is disabled.' >> "$GITHUB_STEP_SUMMARY"

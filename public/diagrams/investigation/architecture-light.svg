<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 630" width="480" height="630" role="img" aria-labelledby="title desc"><title id="title">構成と担当範囲（概念図）</title><desc id="desc">AからB、C、通信ライブラリへ依存する。Bが著者の主担当、Cは別担当。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="630" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">構成と担当範囲（概念図）</text><rect x="65" y="65" width="350" height="66" rx="8" class="fact"/><text x="240.0" y="96" class="label" text-anchor="middle">A｜上位アプリケーション</text><path d="M240 131 L240 169" class="edge" marker-end="url(#arrow)"/><text x="270" y="156" class="small" text-anchor="start">呼出し</text><rect x="65" y="179" width="350" height="90" rx="8" class="decision"/><text x="240.0" y="210" class="label" text-anchor="middle">B｜通信インターフェース</text><text x="240.0" y="237" class="label" text-anchor="middle">私の主担当・コード確認可能</text><path d="M240 269 L240 307" class="edge" marker-end="url(#arrow)"/><rect x="65" y="317" width="350" height="90" rx="8" class="fact"/><text x="240.0" y="348" class="label" text-anchor="middle">C｜デバイス通信処理</text><text x="240.0" y="375" class="label" text-anchor="middle">担当者による内部評価・修正</text><path d="M240 407 L240 445" class="edge" marker-end="url(#arrow)"/><rect x="65" y="455" width="350" height="70" rx="8" class="fact"/><text x="240.0" y="486" class="label" text-anchor="middle">OSS｜通信ライブラリ</text><text x="240" y="565" class="small" text-anchor="middle">更新を含むCをBへ組込み評価</text><text x="240" y="592" class="small" text-anchor="middle">複数の境界をまたいで障害を調査</text></svg>
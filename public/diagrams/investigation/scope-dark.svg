<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-labelledby="title desc"><title id="title">初期調査範囲の選択</title><desc id="desc">B先行を採用。C直接調査は後続で可能とした。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="610" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">初期調査範囲の選択</text><text x="240" y="78" class="label" text-anchor="middle">観測：Cの更新後にクラッシュ</text><path d="M240 94 L122 135" class="edge" marker-end="url(#arrow)"/><path d="M240 94 L358 135" class="edge" marker-end="url(#arrow)"/><rect x="18" y="145" width="212" height="152" rx="8" class="decision"/><text x="124.0" y="176" class="label" text-anchor="middle">Bから調査</text><text x="124.0" y="203" class="label" text-anchor="middle">自分でコードを確認</text><text x="124.0" y="230" class="label" text-anchor="middle">AIの指摘を評価可能</text><text x="124.0" y="257" class="label" text-anchor="middle">【採用】</text><rect x="250" y="145" width="212" height="152" rx="8" class="hypothesis"/><text x="356.0" y="176" class="label" text-anchor="middle">Cを直接調査</text><text x="356.0" y="203" class="label" text-anchor="middle">内部知識が不足</text><text x="356.0" y="230" class="label" text-anchor="middle">独力の評価に制約</text><text x="356.0" y="257" class="label" text-anchor="middle">【当初は見送り】</text><path d="M124 297 L124 345" class="edge" marker-end="url(#arrow)"/><rect x="18" y="355" width="212" height="84" rx="8" class="fact"/><text x="124.0" y="386" class="label" text-anchor="middle">Bの不備と</text><text x="124.0" y="413" class="label" text-anchor="middle">引継ぐ証拠を調査</text><path d="M124 439 L240 488" class="edge" marker-end="url(#arrow)"/><path d="M356 297 L356 460" class="pending" marker-end="url(#arrow)"/><path d="M356 460 L250 488" class="pending" marker-end="url(#arrow)"/><rect x="65" y="498" width="350" height="75" rx="8" class="fact"/><text x="240.0" y="529" class="label" text-anchor="middle">証拠を得た段階でCへ移行</text><text x="240.0" y="556" class="label" text-anchor="middle">C直接調査を全面否定しない</text></svg>
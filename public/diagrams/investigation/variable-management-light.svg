<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 850" width="480" height="850" role="img" aria-labelledby="title desc"><title id="title">変数管理方式の変化（概念図）</title><desc id="desc">担当者と委託先の報告を一般化。クラッシュの修正と残存リークの修正は別である。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="850" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">変数管理方式の変化（概念図）</text><rect x="30" y="75" width="420" height="118" rx="8" class="fact"/><text x="240.0" y="106" class="label" text-anchor="middle">更新前のOSS</text><text x="240.0" y="133" class="label" text-anchor="middle">共有される変数</text><text x="240.0" y="160" class="label" text-anchor="middle">Cは独自の管理方式でカスタマイズ</text><path d="M240 193 L240 220" class="edge" marker-end="url(#arrow)"/><rect x="30" y="230" width="420" height="145" rx="8" class="fact"/><text x="240.0" y="261" class="label" text-anchor="middle">更新後のOSS</text><text x="240.0" y="288" class="label" text-anchor="middle">処理内のローカル変数へ変更</text><text x="240.0" y="315" class="label" text-anchor="middle">メモリ解放処理も変更</text><text x="240.0" y="342" class="label" text-anchor="middle">Cには従来の管理を前提とした実装</text><path d="M240 375 L240 402" class="edge" marker-end="url(#arrow)"/><rect x="30" y="412" width="420" height="118" rx="8" class="hypothesis"/><text x="240.0" y="443" class="label" text-anchor="middle">不整合：新しい解放処理と旧管理</text><text x="240.0" y="470" class="label" text-anchor="middle">報告：不正なアドレスを解放する状態</text><text x="240.0" y="497" class="label" text-anchor="middle">結果：対象クラッシュ</text><path d="M240 530 L240 557" class="edge" marker-end="url(#arrow)"/><rect x="30" y="567" width="420" height="118" rx="8" class="decision"/><text x="240.0" y="598" class="label" text-anchor="middle">C担当者・委託先が修正</text><text x="240.0" y="625" class="label" text-anchor="middle">更新後の変数の扱いに実装を合わせる</text><text x="240.0" y="652" class="label" text-anchor="middle">結果：クラッシュ解消</text><text x="240" y="745" class="small" text-anchor="middle">著者自身の原因確定・修正ではない</text><text x="240" y="772" class="small" text-anchor="middle">実クラス名・変数名・コードは非掲載</text><text x="240" y="799" class="small" text-anchor="middle">残存リークの原因を示す図ではない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1780" width="480" height="1780" role="img" aria-labelledby="title desc"><title id="title">調査の三段階と判断の推移</title><desc id="desc">初期調査、約2週間の著者不関与、担当側のクラッシュ修正、残存リーク再調査を分ける。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="1780" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">調査の三段階と判断の推移</text><text x="240" y="76" class="heading" text-anchor="middle">第1段階｜私の初期調査と引継ぎ</text><rect x="25" y="100" width="430" height="145" rx="8" class="fact"/><text x="240.0" y="131" class="label" text-anchor="middle">観測：C更新後の組合せでクラッシュ</text><text x="240.0" y="158" class="label" text-anchor="middle">仮説：Bの潜在不具合／Cの更新影響</text><text x="240.0" y="185" class="label" text-anchor="middle">判断：自分で評価できるBを先に調査</text><text x="240.0" y="212" class="label" text-anchor="middle">私：AI候補をコードと照合し修正依頼</text><path d="M240 245 L240 265" class="edge" marker-end="url(#arrow)"/><rect x="25" y="275" width="430" height="145" rx="8" class="decision"/><text x="240.0" y="306" class="label" text-anchor="middle">結果：Bを修正してもクラッシュ残存</text><text x="240.0" y="333" class="label" text-anchor="middle">評価：不備の存在と直接原因は別</text><text x="240.0" y="360" class="label" text-anchor="middle">判断：静的調査だけでは絞れない</text><text x="240.0" y="387" class="label" text-anchor="middle">私：実行時の証拠を取得しCへ引継ぐ</text><path d="M240 420 L240 440" class="edge" marker-end="url(#arrow)"/><rect x="25" y="450" width="430" height="130" rx="8" class="hypothesis"/><text x="240.0" y="481" class="label" text-anchor="middle">第2段階｜引継ぎ後の約2週間</text><text x="240.0" y="508" class="label" text-anchor="middle">私：追加調査・修正に不関与</text><text x="240.0" y="535" class="label" text-anchor="middle">C担当者・委託先：原因調査と修正</text><text x="240.0" y="562" class="label" text-anchor="middle">この経過期間を著者の稼働としない</text><path d="M240 580 L240 600" class="edge" marker-end="url(#arrow)"/><rect x="25" y="610" width="430" height="145" rx="8" class="fact"/><text x="240.0" y="641" class="label" text-anchor="middle">Cの先行リークは直接原因として未確認</text><text x="240.0" y="668" class="label" text-anchor="middle">報告：OSSの変数管理・解放処理と</text><text x="240.0" y="695" class="label" text-anchor="middle">Cの既存カスタマイズとの不整合</text><text x="240.0" y="722" class="label" text-anchor="middle">担当側が修正：クラッシュ解消</text><text x="240" y="810" class="heading" text-anchor="middle">第3段階｜私が残存リークを再調査</text><path d="M240 825 L240 840" class="edge" marker-end="url(#arrow)"/><rect x="25" y="850" width="430" height="172" rx="8" class="decision"/><text x="240.0" y="881" class="label" text-anchor="middle">観測：対象範囲が狭まり履歴が蓄積</text><text x="240.0" y="908" class="label" text-anchor="middle">仮説：OSS更新差分に原因候補がある</text><text x="240.0" y="935" class="label" text-anchor="middle">判断：正常版と異常版を比較する</text><text x="240.0" y="962" class="label" text-anchor="middle">私：履歴全文・両版コードを提供</text><text x="240.0" y="989" class="label" text-anchor="middle">AI：差分を調べ複数の案を提示</text><path d="M240 1022 L240 1042" class="edge" marker-end="url(#arrow)"/><rect x="25" y="1052" width="430" height="172" rx="8" class="decision"/><text x="240.0" y="1083" class="label" text-anchor="middle">評価：一案は残る課題との関係が薄い</text><text x="240.0" y="1110" class="label" text-anchor="middle">判断：一案を見送り別の候補を優先</text><text x="240.0" y="1137" class="label" text-anchor="middle">理由：OSS更新との関連性を確認する</text><text x="240.0" y="1164" class="label" text-anchor="middle">私：説明とコードを自分で照合</text><text x="240.0" y="1191" class="label" text-anchor="middle">判断：根拠付きで修正案を提案する</text><path d="M240 1224 L240 1244" class="edge" marker-end="url(#arrow)"/><rect x="25" y="1254" width="430" height="172" rx="8" class="fact"/><text x="240.0" y="1285" class="label" text-anchor="middle">私：実環境で検証できず効果確認依頼</text><text x="240.0" y="1312" class="label" text-anchor="middle">担当者：発生箇所の確認・修正・検証</text><text x="240.0" y="1339" class="label" text-anchor="middle">結果：残存メモリリークを解消</text><text x="240.0" y="1366" class="label" text-anchor="middle">評価：確認済みの解決</text><text x="240.0" y="1393" class="label" text-anchor="middle">工数削減効果：比較データがなく不明</text><rect x="25" y="1460" width="430" height="118" rx="8" class="decision"/><text x="240.0" y="1491" class="label" text-anchor="middle">私自身の稼働工数：2人日</text><text x="240.0" y="1518" class="label" text-anchor="middle">関係担当者の修正・検証工数は含まない</text><text x="240.0" y="1545" class="label" text-anchor="middle">解決までの経過日数・総工数ではない</text><text x="240" y="1630" class="small" text-anchor="middle">各作業の時刻・日別配分は未確定</text><text x="240" y="1657" class="small" text-anchor="middle">長さは時間に比例しない／人時へ換算しない</text><text x="240" y="1684" class="small" text-anchor="middle">約2週間と2人日は別の値</text></svg>
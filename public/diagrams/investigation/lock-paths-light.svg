<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" width="480" height="710" role="img" aria-labelledby="title desc"><title id="title">終了経路の比較（概念図）</title><desc id="desc">所有権解放と同期オブジェクト破棄は異なる。実際のコードは示さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="710" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">終了経路の比較（概念図）</text><rect x="125" y="64" width="230" height="60" rx="8" class="fact"/><text x="240.0" y="95" class="label" text-anchor="middle">ロックを取得</text><path d="M240 124 L120 168" class="edge" marker-end="url(#arrow)"/><path d="M240 124 L360 168" class="edge" marker-end="url(#arrow)"/><rect x="20" y="180" width="210" height="66" rx="8" class="fact"/><text x="125.0" y="211" class="label" text-anchor="middle">異常終了経路</text><rect x="250" y="180" width="210" height="66" rx="8" class="fact"/><text x="355.0" y="211" class="label" text-anchor="middle">正常終了経路</text><path d="M125 246 L125 278" class="edge" marker-end="url(#arrow)"/><path d="M355 246 L355 278" class="edge" marker-end="url(#arrow)"/><rect x="20" y="288" width="210" height="82" rx="8" class="fact"/><text x="125.0" y="319" class="label" text-anchor="middle">所有権を解放</text><text x="125.0" y="346" class="label" text-anchor="middle">（既存処理）</text><rect x="250" y="288" width="210" height="82" rx="8" class="hypothesis"/><text x="355.0" y="319" class="label" text-anchor="middle">所有権解放が欠落</text><text x="355.0" y="346" class="label" text-anchor="middle">【確認した不備】</text><path d="M125 370 L125 402" class="edge" marker-end="url(#arrow)"/><path d="M355 370 L355 402" class="edge" marker-end="url(#arrow)"/><rect x="20" y="412" width="210" height="82" rx="8" class="fact"/><text x="125.0" y="443" class="label" text-anchor="middle">同期オブジェクト</text><text x="125.0" y="470" class="label" text-anchor="middle">を破棄</text><rect x="250" y="412" width="210" height="82" rx="8" class="fact"/><text x="355.0" y="443" class="label" text-anchor="middle">同期オブジェクト</text><text x="355.0" y="470" class="label" text-anchor="middle">を破棄</text><text x="240" y="546" class="label" text-anchor="middle">修正案：正常経路でも</text><text x="240" y="573" class="label" text-anchor="middle">所有権を解放してから破棄する</text><rect x="35" y="596" width="410" height="76" rx="8" class="decision"/><text x="240.0" y="627" class="label" text-anchor="middle">修正は実施 → 対象クラッシュは残存</text><text x="240.0" y="654" class="label" text-anchor="middle">不備の存在と直接原因は別</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 850" width="480" height="850" role="img" aria-labelledby="title desc"><title id="title">問題と修正結果を分ける</title><desc id="desc">B潜在不具合とCの先行リークは今回の直接原因として未確認。クラッシュは互換性修正で解消、残存リークは後続対応。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="850" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">問題と修正結果を分ける</text><rect x="40" y="66" width="400" height="60" rx="8" class="fact"/><text x="240.0" y="97" class="label" text-anchor="middle">対象：更新後のクラッシュ</text><path d="M240 126 L240 151" class="edge" marker-end="url(#arrow)"/><rect x="40" y="161" width="400" height="86" rx="8" class="fact"/><text x="240.0" y="192" class="label" text-anchor="middle">Bのロック解放漏れを修正</text><text x="240.0" y="219" class="label" text-anchor="middle">結果：クラッシュは残った</text><path d="M240 247 L240 272" class="edge" marker-end="url(#arrow)"/><rect x="40" y="282" width="400" height="86" rx="8" class="fact"/><text x="240.0" y="313" class="label" text-anchor="middle">Cの先行リークを確認・修正</text><text x="240.0" y="340" class="label" text-anchor="middle">結果：今回の直接原因として未確認</text><path d="M240 368 L240 393" class="edge" marker-end="url(#arrow)"/><rect x="40" y="403" width="400" height="86" rx="8" class="decision"/><text x="240.0" y="434" class="label" text-anchor="middle">C担当側が互換性問題を特定・修正</text><text x="240.0" y="461" class="label" text-anchor="middle">結果：対象クラッシュが解消</text><text x="240" y="535" class="small" text-anchor="middle">ここからは別の現象を調査</text><path d="M240 551 L240 580" class="edge" marker-end="url(#arrow)"/><rect x="40" y="590" width="400" height="86" rx="8" class="fact"/><text x="240.0" y="621" class="label" text-anchor="middle">残存リークを調査</text><text x="240.0" y="648" class="label" text-anchor="middle">前の修正で全体解決とはしない</text><path d="M240 676 L240 701" class="edge" marker-end="url(#arrow)"/><rect x="40" y="711" width="400" height="86" rx="8" class="decision"/><text x="240.0" y="742" class="label" text-anchor="middle">私の候補提示＋担当者の修正・検証</text><text x="240.0" y="769" class="label" text-anchor="middle">結果：残存メモリリークを解消</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" width="480" height="710" role="img" aria-labelledby="title desc"><title id="title">結果から調査方針へ戻る</title><desc id="desc">観測と仮説を区別し、結果を受けて調査範囲を見直す循環。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="710" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">結果から調査方針へ戻る</text><rect x="75" y="65" width="330" height="65" rx="8" class="fact"/><text x="240.0" y="96" class="label" text-anchor="middle">観測事実を集める</text><path d="M240 130 L240 154" class="edge" marker-end="url(#arrow)"/><rect x="75" y="164" width="330" height="65" rx="8" class="hypothesis"/><text x="240.0" y="195" class="label" text-anchor="middle">仮説と未確認事項を置く</text><path d="M240 229 L240 253" class="edge" marker-end="url(#arrow)"/><rect x="75" y="263" width="330" height="65" rx="8" class="decision"/><text x="240.0" y="294" class="label" text-anchor="middle">評価できる範囲と手段を選ぶ</text><path d="M240 328 L240 352" class="edge" marker-end="url(#arrow)"/><rect x="75" y="362" width="330" height="65" rx="8" class="fact"/><text x="240.0" y="393" class="label" text-anchor="middle">AI探索・コード確認・動的証拠</text><path d="M240 427 L240 451" class="edge" marker-end="url(#arrow)"/><rect x="75" y="461" width="330" height="65" rx="8" class="fact"/><text x="240.0" y="492" class="label" text-anchor="middle">結果と仮説を照合する</text><path d="M75 494H26V197H75" class="pending" marker-end="url(#arrow)"/><path d="M240 526 L240 550" class="edge" marker-end="url(#arrow)"/><rect x="75" y="560" width="330" height="90" rx="8" class="fact"/><text x="240.0" y="591" class="label" text-anchor="middle">担当者と修正・検証を連携</text><text x="240.0" y="618" class="label" text-anchor="middle">根拠と責任範囲を引き継ぐ</text><text x="240" y="688" class="small" text-anchor="middle">破線：仮説や範囲を更新する経路</text></svg>
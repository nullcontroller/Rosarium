<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-labelledby="title desc"><title id="title">正常版・異常版から候補を調べる</title><desc id="desc">正常は今回の現象がない条件を指す。版全体の無欠陥を意味しない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="800" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">正常版・異常版から候補を調べる</text><rect x="18" y="80" width="212" height="118" rx="8" class="fact"/><text x="124.0" y="111" class="label" text-anchor="middle">正常条件のOSS版</text><text x="124.0" y="138" class="label" text-anchor="middle">今回のリークなし</text><text x="124.0" y="165" class="label" text-anchor="middle">比較用コードを渡す</text><rect x="250" y="80" width="212" height="118" rx="8" class="fact"/><text x="356.0" y="111" class="label" text-anchor="middle">異常条件のOSS版</text><text x="356.0" y="138" class="label" text-anchor="middle">今回のリークあり</text><text x="356.0" y="165" class="label" text-anchor="middle">比較用コードを渡す</text><path d="M124 198 L210 238" class="edge" marker-end="url(#arrow)"/><path d="M356 198 L270 238" class="edge" marker-end="url(#arrow)"/><rect x="30" y="248" width="420" height="118" rx="8" class="hypothesis"/><text x="240.0" y="279" class="label" text-anchor="middle">AI：両版の差分を調査</text><text x="240.0" y="306" class="label" text-anchor="middle">更新に関係する原因候補を提示</text><text x="240.0" y="333" class="label" text-anchor="middle">差分の存在だけで原因としない</text><path d="M240 366 L240 395" class="edge" marker-end="url(#arrow)"/><rect x="30" y="405" width="420" height="118" rx="8" class="decision"/><text x="240.0" y="436" class="label" text-anchor="middle">私：複数候補の関連性を評価</text><text x="240.0" y="463" class="label" text-anchor="middle">OSS更新・対象処理との対応を優先</text><text x="240.0" y="490" class="label" text-anchor="middle">実際のコードを読み修正案を提案</text><path d="M240 523 L240 552" class="edge" marker-end="url(#arrow)"/><rect x="30" y="562" width="420" height="118" rx="8" class="fact"/><text x="240.0" y="593" class="label" text-anchor="middle">担当者側：発生箇所を確認</text><text x="240.0" y="620" class="label" text-anchor="middle">修正と実環境での効果検証</text><text x="240.0" y="647" class="label" text-anchor="middle">著者の環境では効果確認できない</text><text x="240" y="738" class="small" text-anchor="middle">正常版の全機能を保証しない</text><text x="240" y="765" class="small" text-anchor="middle">内部の差分・バージョン番号は非掲載</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="480" height="720" role="img" aria-labelledby="title desc"><title id="title">初期調査と再調査の範囲</title><desc id="desc">担当者側の蓄積により再調査の対象が限定され、著者が評価できる差分へ絞った。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="720" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">初期調査と再調査の範囲</text><rect x="25" y="75" width="430" height="172" rx="8" class="fact"/><text x="240.0" y="106" class="label" text-anchor="middle">初期調査</text><text x="240.0" y="133" class="label" text-anchor="middle">対象：更新後の組合せでクラッシュ</text><text x="240.0" y="160" class="label" text-anchor="middle">責任箇所・原因の範囲が広く未確定</text><text x="240.0" y="187" class="label" text-anchor="middle">私：自分で評価できるBを先に調査</text><text x="240.0" y="214" class="label" text-anchor="middle">結果：証拠と候補をC側へ引継ぐ</text><path d="M240 247 L240 275" class="edge" marker-end="url(#arrow)"/><rect x="25" y="285" width="430" height="118" rx="8" class="hypothesis"/><text x="240.0" y="316" class="label" text-anchor="middle">引継ぎ後：私が不関与の約2週間</text><text x="240.0" y="343" class="label" text-anchor="middle">C担当者・委託先の調査と修正</text><text x="240.0" y="370" class="label" text-anchor="middle">クラッシュ解消後も別のリーク残存</text><path d="M240 403 L240 430" class="edge" marker-end="url(#arrow)"/><rect x="25" y="440" width="430" height="172" rx="8" class="decision"/><text x="240.0" y="471" class="label" text-anchor="middle">残存リークの再調査</text><text x="240.0" y="498" class="label" text-anchor="middle">既知：対象処理・履歴・正常／異常版</text><text x="240.0" y="525" class="label" text-anchor="middle">私：履歴全文と両版のコードを渡す</text><text x="240.0" y="552" class="label" text-anchor="middle">判断：評価できる差分へ対象を限定</text><text x="240.0" y="579" class="label" text-anchor="middle">C全体を一から再調査したのではない</text><text x="240" y="660" class="small" text-anchor="middle">範囲の縮小を精度や工数の優位性へ換算しない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" width="480" height="760" role="img" aria-labelledby="title desc"><title id="title">情報と依頼作業の見直し</title><desc id="desc">初回回答、元情報追加、方針、横断検索、コード確認への変化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="760" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">情報と依頼作業の見直し</text><rect x="40" y="65" width="400" height="72" rx="8" class="fact"/><text x="240.0" y="96" class="label" text-anchor="middle">私：背景と調査結果を要約して渡す</text><path d="M240 137 L240 162" class="edge" marker-end="url(#arrow)"/><rect x="40" y="172" width="400" height="72" rx="8" class="fact"/><text x="240.0" y="203" class="label" text-anchor="middle">AI：一般的な方針を提示</text><text x="240.0" y="230" class="label" text-anchor="middle">次のコード箇所は未特定</text><path d="M240 244 L240 269" class="edge" marker-end="url(#arrow)"/><rect x="40" y="279" width="400" height="72" rx="8" class="hypothesis"/><text x="240.0" y="310" class="label" text-anchor="middle">私：要約の情報欠落を疑う</text><text x="240.0" y="337" class="label" text-anchor="middle">元の調査結果を追加</text><path d="M240 351 L240 376" class="edge" marker-end="url(#arrow)"/><rect x="40" y="386" width="400" height="72" rx="8" class="fact"/><text x="240.0" y="417" class="label" text-anchor="middle">AI：調査の選択肢と手順を提示</text><text x="240.0" y="444" class="label" text-anchor="middle">方針だけでは箇所を選べない</text><path d="M240 458 L240 483" class="edge" marker-end="url(#arrow)"/><rect x="40" y="493" width="400" height="72" rx="8" class="decision"/><text x="240.0" y="524" class="label" text-anchor="middle">私：横断検索へ依頼を切替</text><text x="240.0" y="551" class="label" text-anchor="middle">質問に答えながら探索を継続</text><path d="M240 565 L240 590" class="edge" marker-end="url(#arrow)"/><rect x="40" y="600" width="400" height="72" rx="8" class="fact"/><text x="240.0" y="631" class="label" text-anchor="middle">AI：不具合候補を提示</text><text x="240.0" y="658" class="label" text-anchor="middle">私：該当コードを確認</text><text x="240" y="720" class="small" text-anchor="middle">破線＝その時点の仮説／太線＝私の判断</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1020" width="480" height="1020" role="img" aria-labelledby="title desc"><title id="title">指示に含める情報と判断基準</title><desc id="desc">実務から編集上整理したモデル。既存の定型管理制度を実施していたという意味ではない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="1020" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">指示に含める情報と判断基準</text><rect x="25" y="75" width="430" height="172" rx="8" class="fact"/><text x="240.0" y="106" class="label" text-anchor="middle">目的：何を明らかにしたいか</text><text x="240.0" y="133" class="label" text-anchor="middle">対象範囲：どの現象・処理を調べるか</text><text x="240.0" y="160" class="label" text-anchor="middle">既知と未確認：観測、試行、結果</text><text x="240.0" y="187" class="label" text-anchor="middle">比較条件：今回の正常版と異常版</text><text x="240.0" y="214" class="label" text-anchor="middle">参照先：調査履歴と両版のコード</text><path d="M240 247 L240 275" class="edge" marker-end="url(#arrow)"/><rect x="25" y="285" width="430" height="145" rx="8" class="decision"/><text x="240.0" y="316" class="label" text-anchor="middle">作業：コード探索・差分から候補調査</text><text x="240.0" y="343" class="label" text-anchor="middle">期待する出力：根拠と候補・未確認点</text><text x="240.0" y="370" class="label" text-anchor="middle">基準：OSS更新と現象との関連性</text><text x="240.0" y="397" class="label" text-anchor="middle">境界：AIの候補は確定原因ではない</text><path d="M240 430 L240 460" class="edge" marker-end="url(#arrow)"/><rect x="25" y="470" width="430" height="118" rx="8" class="fact"/><text x="240.0" y="501" class="label" text-anchor="middle">対象にアクセスできるAI環境</text><text x="240.0" y="528" class="label" text-anchor="middle">文脈がなければ前提を共有する</text><text x="240.0" y="555" class="label" text-anchor="middle">必要な情報と、任せる作業を渡す</text><path d="M240 588 L240 618" class="edge" marker-end="url(#arrow)"/><rect x="25" y="628" width="430" height="145" rx="8" class="decision"/><text x="240.0" y="659" class="label" text-anchor="middle">私：回答をコード・実行時証拠と照合</text><text x="240.0" y="686" class="label" text-anchor="middle">候補の採否、優先順位、修正案の判断</text><text x="240.0" y="713" class="label" text-anchor="middle">担当者：担当実装の確認・修正・検証</text><text x="240.0" y="740" class="label" text-anchor="middle">結果を評価して次の調査へ戻す</text><text x="240" y="845" class="small" text-anchor="middle">情報量を増やせば必ず成功するわけではない</text><text x="240" y="872" class="small" text-anchor="middle">履歴全文の提供を全案件の最適解としない</text><text x="240" y="899" class="small" text-anchor="middle">今回の経験から整理した方法論である</text></svg>
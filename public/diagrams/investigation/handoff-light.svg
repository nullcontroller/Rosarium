<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" width="480" height="660" role="img" aria-labelledby="title desc"><title id="title">証拠と候補の引継ぎ</title><desc id="desc">観測と仮説を分け、評価できない修正は担当者に委ねる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.small{font-size:16px;fill:#4a6262}.heading{font-size:22px;font-weight:700}.fact{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.decision{fill:#f5f8f2;stroke:#165f54;stroke-width:3}.hypothesis{fill:#f5f8f2;stroke:#657a77;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#165f54;stroke-width:2;fill:none}.pending{stroke:#657a77;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#657a77;stroke-width:1}</style><rect width="480" height="660" rx="10" fill="#f5f8f2"/><text x="240" y="34" class="heading" text-anchor="middle">証拠と候補の引継ぎ</text><rect x="28" y="67" width="204" height="112" rx="8" class="fact"/><text x="130.0" y="98" class="label" text-anchor="middle">観測された証拠</text><text x="130.0" y="125" class="label" text-anchor="middle">例外・呼出し履歴</text><text x="130.0" y="152" class="label" text-anchor="middle">不正な変数状態</text><rect x="250" y="67" width="204" height="112" rx="8" class="hypothesis"/><text x="352.0" y="98" class="label" text-anchor="middle">原因の候補</text><text x="352.0" y="125" class="label" text-anchor="middle">AIが提示する説明</text><text x="352.0" y="152" class="label" text-anchor="middle">その時点では未確定</text><path d="M130 179 L210 220" class="edge" marker-end="url(#arrow)"/><path d="M350 179 L270 220" class="pending" marker-end="url(#arrow)"/><rect x="40" y="230" width="400" height="94" rx="8" class="decision"/><text x="240.0" y="261" class="label" text-anchor="middle">私：Cの開発環境へ文脈を渡す</text><text x="240.0" y="288" class="label" text-anchor="middle">既知の結果・残る現象・次の問い</text><path d="M240 324 L240 355" class="edge" marker-end="url(#arrow)"/><rect x="40" y="365" width="400" height="94" rx="8" class="fact"/><text x="240.0" y="396" class="label" text-anchor="middle">AI：関連コードを調べ候補を提示</text><text x="240.0" y="423" class="label" text-anchor="middle">私：根拠と未確認事項を整理</text><path d="M240 459 L240 490" class="edge" marker-end="url(#arrow)"/><rect x="40" y="500" width="400" height="94" rx="8" class="fact"/><text x="240.0" y="531" class="label" text-anchor="middle">C担当者：追加確認・修正判断</text><text x="240.0" y="558" class="label" text-anchor="middle">実装と実環境での効果検証</text><text x="240" y="635" class="small" text-anchor="middle">候補の提示 ≠ 採用する修正の決定</text></svg>
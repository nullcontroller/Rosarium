<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" width="480" height="780" role="img" aria-labelledby="title desc"><title id="title">残存リークの仮説検証</title><desc id="desc">二つの候補の一方は採用せず、もう一方をコード確認し担当者へ依頼した。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="780" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">残存リークの仮説検証</text><rect x="40" y="65" width="400" height="77" rx="8" class="fact"/><text x="240.0" y="96" class="label" text-anchor="middle">私：蓄積された履歴を渡す</text><text x="240.0" y="123" class="label" text-anchor="middle">関連コードを自分でも確認</text><path d="M240 142 L240 167" class="edge" marker-end="url(#arrow)"/><rect x="40" y="177" width="400" height="77" rx="8" class="decision"/><text x="240.0" y="208" class="label" text-anchor="middle">私：問題のある版と前回版を指定</text><text x="240.0" y="235" class="label" text-anchor="middle">AI：差分から二つの案を提示</text><path d="M240 254 L124 298" class="edge" marker-end="url(#arrow)"/><path d="M240 254 L356 298" class="edge" marker-end="url(#arrow)"/><rect x="18" y="308" width="212" height="110" rx="8" class="hypothesis"/><text x="124.0" y="339" class="label" text-anchor="middle">候補1</text><text x="124.0" y="366" class="label" text-anchor="middle">関係が薄いと判断</text><text x="124.0" y="393" class="label" text-anchor="middle">今回の対象に不採用</text><rect x="250" y="308" width="212" height="110" rx="8" class="hypothesis"/><text x="356.0" y="339" class="label" text-anchor="middle">候補2</text><text x="356.0" y="366" class="label" text-anchor="middle">関連処理と整合</text><text x="356.0" y="393" class="label" text-anchor="middle">コードを直接確認</text><path d="M356 418 L356 453" class="edge" marker-end="url(#arrow)"/><rect x="250" y="463" width="212" height="85" rx="8" class="decision"/><text x="356.0" y="494" class="label" text-anchor="middle">私：根拠付きで</text><text x="356.0" y="521" class="label" text-anchor="middle">修正・効果確認依頼</text><path d="M356 548 L240 594" class="edge" marker-end="url(#arrow)"/><rect x="40" y="604" width="400" height="90" rx="8" class="fact"/><text x="240.0" y="635" class="label" text-anchor="middle">担当者：問題確認・修正・検証</text><text x="240.0" y="662" class="label" text-anchor="middle">残存リークの解決</text><text x="240" y="739" class="small" text-anchor="middle">候補のAI提示と、人間による採用は別</text></svg>
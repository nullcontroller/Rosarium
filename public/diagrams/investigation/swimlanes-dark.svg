<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1050" width="480" height="1050" role="img" aria-labelledby="title desc"><title id="title">三段階の調査スイムレーン</title><desc id="desc">約2週間の著者不関与を示す。共同欄は担当者と委託先の作業の個別分担を確定しない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.small{font-size:16px;fill:#bfd2ce}.heading{font-size:22px;font-weight:700}.fact{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.decision{fill:#1c2b2e;stroke:#96d1c2;stroke-width:3}.hypothesis{fill:#1c2b2e;stroke:#92aaa5;stroke-width:2;stroke-dasharray:7 5}.edge{stroke:#96d1c2;stroke-width:2;fill:none}.pending{stroke:#92aaa5;stroke-width:2;stroke-dasharray:6 4;fill:none}.lane{fill:none;stroke:#92aaa5;stroke-width:1}</style><rect width="480" height="1050" rx="10" fill="#1c2b2e"/><text x="240" y="34" class="heading" text-anchor="middle">三段階の調査スイムレーン</text><text x="82" y="82" class="heading" text-anchor="middle">私</text><text x="240" y="82" class="heading" text-anchor="middle">C担当者</text><text x="396" y="82" class="heading" text-anchor="middle">委託先</text><path d="M160 98V900M320 98V900" class="lane"/><text x="240" y="125" class="small" text-anchor="middle">第1段階｜初期調査・引継ぎ</text><rect x="12" y="145" width="138" height="145" rx="8" class="decision"/><text x="81.0" y="176" class="label" text-anchor="middle">Bを調査</text><text x="81.0" y="203" class="label" text-anchor="middle">根拠を確認</text><text x="81.0" y="230" class="label" text-anchor="middle">証拠・候補を</text><text x="81.0" y="257" class="label" text-anchor="middle">引継ぐ</text><rect x="175" y="165" width="290" height="100" rx="8" class="fact"/><text x="320.0" y="196" class="label" text-anchor="middle">証拠・原因候補を受領</text><text x="320.0" y="223" class="label" text-anchor="middle">追加確認を引き継ぐ</text><path d="M150 214 L170 214" class="edge" marker-end="url(#arrow)"/><text x="240" y="335" class="small" text-anchor="middle">第2段階｜引継ぎ後の約2週間</text><rect x="12" y="360" width="138" height="145" rx="8" class="hypothesis"/><text x="81.0" y="391" class="label" text-anchor="middle">追加調査</text><text x="81.0" y="418" class="label" text-anchor="middle">修正作業に</text><text x="81.0" y="445" class="label" text-anchor="middle">関与しない</text><text x="81.0" y="472" class="label" text-anchor="middle">報告を待つ</text><rect x="175" y="360" width="290" height="145" rx="8" class="fact"/><text x="320.0" y="391" class="label" text-anchor="middle">共同：原因特定・修正</text><text x="320.0" y="418" class="label" text-anchor="middle">OSS更新と既存実装の</text><text x="320.0" y="445" class="label" text-anchor="middle">不整合を調査・対応</text><text x="320.0" y="472" class="label" text-anchor="middle">結果：クラッシュ解消</text><text x="240" y="570" class="small" text-anchor="middle">第3段階｜残存リークを別課題にする</text><rect x="12" y="600" width="138" height="172" rx="8" class="decision"/><text x="81.0" y="631" class="label" text-anchor="middle">私が再調査</text><text x="81.0" y="658" class="label" text-anchor="middle">履歴と差分</text><text x="81.0" y="685" class="label" text-anchor="middle">コード確認</text><text x="81.0" y="712" class="label" text-anchor="middle">修正案提案</text><text x="81.0" y="739" class="label" text-anchor="middle">効果確認依頼</text><rect x="175" y="630" width="290" height="118" rx="8" class="fact"/><text x="320.0" y="661" class="label" text-anchor="middle">担当者側：発生箇所を確認</text><text x="320.0" y="688" class="label" text-anchor="middle">修正・実環境で効果確認</text><text x="320.0" y="715" class="label" text-anchor="middle">結果：残存リーク解消</text><path d="M150 685 L170 685" class="edge" marker-end="url(#arrow)"/><text x="240" y="830" class="small" text-anchor="middle">私の残存リーク対応の稼働工数は2人日</text><text x="240" y="857" class="small" text-anchor="middle">共同欄の個別作業分担は未確定</text><text x="240" y="884" class="small" text-anchor="middle">約2週間を私の工数へ算入しない</text><text x="240" y="965" class="small" text-anchor="middle">縦方向は順序を示し、期間に比例しない</text></svg>
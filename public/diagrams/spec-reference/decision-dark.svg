<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1020" viewBox="0 0 480 1020" role="img" aria-labelledby="title desc"><title id="title">方式選定の判断過程</title><desc id="desc">個別提供の負担、Python統合案の文書長大化を踏まえ、既存ファイル構造を維持するリポジトリ参照方式を採用してレビューを実施した。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#bfd2ce}.node{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.chosen{fill:#283f3e;stroke:#96d1c2;stroke-width:3}.human{fill:#1c2b2e;stroke:#96d1c2;stroke-width:2.5;stroke-dasharray:7 4}.outline{fill:none;stroke:#92aaa5;stroke-width:1}.edge{fill:none;stroke:#96d1c2;stroke-width:2}.dashed{stroke-dasharray:6 4}</style><rect width="480" height="1020" rx="10" fill="#1c2b2e"/><text x="240" y="33" class="heading" text-anchor="middle">方式選定の判断過程</text><rect x="45" y="65" width="390" height="76" rx="7" class="node"/><text x="240.0" y="94" class="label" text-anchor="middle">多数のMarkdownファイル</text><text x="240.0" y="120" class="label" text-anchor="middle">元のファイル構造がある</text><path d="M240 141L240 172" class="edge " marker-end="url(#arrow)"/><rect x="45" y="182" width="390" height="76" rx="7" class="node"/><text x="240.0" y="211" class="label" text-anchor="middle">個別に提供すると</text><text x="240.0" y="237" class="label" text-anchor="middle">準備の手間が掛かる</text><path d="M240 258L240 289" class="edge " marker-end="url(#arrow)"/><rect x="45" y="299" width="390" height="76" rx="7" class="node"/><text x="240.0" y="328" class="label" text-anchor="middle">Pythonで単一文書へ</text><text x="240.0" y="354" class="label" text-anchor="middle">統合する案を検討</text><path d="M240 375L240 406" class="edge " marker-end="url(#arrow)"/><rect x="45" y="416" width="390" height="76" rx="7" class="node"/><text x="240.0" y="445" class="label" text-anchor="middle">文書が長大になる課題</text><text x="240.0" y="471" class="label" text-anchor="middle">今回は統合案を採用しない</text><path d="M240 492L240 523" class="edge " marker-end="url(#arrow)"/><rect x="45" y="533" width="390" height="76" rx="7" class="chosen"/><text x="240.0" y="562" class="label" text-anchor="middle">既存のファイル構造を</text><text x="240.0" y="588" class="label" text-anchor="middle">維持して参照する方法を選ぶ</text><path d="M240 609L240 640" class="edge " marker-end="url(#arrow)"/><rect x="45" y="650" width="390" height="76" rx="7" class="chosen"/><text x="240.0" y="679" class="label" text-anchor="middle">リポジトリ参照方式を採用</text><text x="240.0" y="705" class="label" text-anchor="middle">個別提供と単一文書化を避ける</text><path d="M240 726L240 757" class="edge " marker-end="url(#arrow)"/><rect x="45" y="767" width="390" height="76" rx="7" class="node"/><text x="240.0" y="796" class="label" text-anchor="middle">AIが文書を参照し</text><text x="240.0" y="822" class="label" text-anchor="middle">横断レビューを実施</text><text x="240" y="902" class="small" text-anchor="middle">実施できたことを確認</text><text x="240" y="928" class="small" text-anchor="middle">三方式の精度・工数の比較実験ではない</text><text x="240" y="954" class="small" text-anchor="middle">参照可能性と全件レビューの保証は異なる</text></svg>
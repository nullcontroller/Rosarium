<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="0 0 480 840" role="img" aria-labelledby="title desc"><title id="title">採用したレビュー方式（概念図）</title><desc id="desc">私が文書を配置し、AIがリポジトリ内の文書を参照する。AIの指摘事項を私が確認し、修正の採否を判断する。実際の社内構成は示さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#96d1c2"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#edf5ef}.label{font-size:18px}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#bfd2ce}.node{fill:#283f3e;stroke:#92aaa5;stroke-width:1.5}.chosen{fill:#283f3e;stroke:#96d1c2;stroke-width:3}.human{fill:#1c2b2e;stroke:#96d1c2;stroke-width:2.5;stroke-dasharray:7 4}.outline{fill:none;stroke:#92aaa5;stroke-width:1}.edge{fill:none;stroke:#96d1c2;stroke-width:2}.dashed{stroke-dasharray:6 4}</style><rect width="480" height="840" rx="10" fill="#1c2b2e"/><text x="240" y="33" class="heading" text-anchor="middle">採用したレビュー方式（概念図）</text><rect x="35" y="65" width="410" height="63" rx="7" class="human"/><text x="240.0" y="94" class="label" text-anchor="middle">私｜レビュー対象を準備</text><path d="M240 128L240 158" class="edge " marker-end="url(#arrow)"/><text x="282" y="150" class="small" text-anchor="start">配置</text><rect x="55" y="168" width="370" height="145" rx="10" class="chosen"/><text x="240" y="198" class="label" text-anchor="middle">業務上のリポジトリ</text><path d="M125 221h30l12 12v42h-42z M155 221v12h12" class="node"/><text x="146" y="255" class="small" text-anchor="middle">MD</text><path d="M215 221h30l12 12v42h-42z M245 221v12h12" class="node"/><text x="236" y="255" class="small" text-anchor="middle">MD</text><path d="M305 221h30l12 12v42h-42z M335 221v12h12" class="node"/><text x="326" y="255" class="small" text-anchor="middle">MD</text><text x="240" y="301" class="small" text-anchor="middle">ファイル単位のMarkdown</text><path d="M180 367L180 324" class="edge " marker-end="url(#arrow)"/><text x="128" y="351" class="small" text-anchor="middle">文書参照</text><rect x="55" y="377" width="370" height="81" rx="7" class="node"/><text x="240.0" y="406" class="label" text-anchor="middle">生成AI｜横断レビュー</text><text x="240.0" y="432" class="label" text-anchor="middle">必要な記述と現在のコードを照合</text><path d="M240 458L240 492" class="edge " marker-end="url(#arrow)"/><rect x="95" y="502" width="290" height="67" rx="7" class="node"/><text x="240.0" y="531" class="label" text-anchor="middle">指摘事項・根拠・修正候補</text><path d="M240 569L240 603" class="edge " marker-end="url(#arrow)"/><rect x="35" y="613" width="410" height="93" rx="7" class="human"/><text x="240.0" y="642" class="label" text-anchor="middle">私｜根拠とコードを確認</text><text x="240.0" y="668" class="label" text-anchor="middle">修正するか現状維持かを判断</text><text x="240" y="758" class="small" text-anchor="middle">実線：文書参照・候補の流れ</text><text x="240" y="784" class="small" text-anchor="middle">破線枠：人間が担う準備と確認</text><text x="240" y="810" class="small" text-anchor="middle">文書を参照できることは網羅性の保証ではない</text></svg>
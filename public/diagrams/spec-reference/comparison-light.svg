<svg xmlns="http://www.w3.org/2000/svg" width="480" height="930" viewBox="0 0 480 930" role="img" aria-labelledby="title desc"><title id="title">三つの参照方式（模式図）</title><desc id="desc">方式選定時の構造比較。個別提供とPython統合は不採用、リポジトリ参照を採用。図中の文書数に実数の意味はない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#165f54"/></marker></defs><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#1d3032}.label{font-size:18px}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#4a6262}.node{fill:#e0ece4;stroke:#657a77;stroke-width:1.5}.chosen{fill:#e0ece4;stroke:#165f54;stroke-width:3}.human{fill:#f5f8f2;stroke:#165f54;stroke-width:2.5;stroke-dasharray:7 4}.outline{fill:none;stroke:#657a77;stroke-width:1}.edge{fill:none;stroke:#165f54;stroke-width:2}.dashed{stroke-dasharray:6 4}</style><rect width="480" height="930" rx="10" fill="#f5f8f2"/><text x="240" y="33" class="heading" text-anchor="middle">三つの参照方式（模式図）</text><text x="30" y="85" class="label" text-anchor="start">方式1｜個別提供【不採用】</text><path d="M30 115h30l12 12v42h-42z M60 115v12h12" class="node"/><text x="51" y="149" class="small" text-anchor="middle">MD</text><path d="M78 131h30l12 12v42h-42z M108 131v12h12" class="node"/><text x="99" y="165" class="small" text-anchor="middle">MD</text><path d="M126 147h30l12 12v42h-42z M156 147v12h12" class="node"/><text x="147" y="181" class="small" text-anchor="middle">MD</text><path d="M185 160L250 160" class="edge " marker-end="url(#arrow)"/><rect x="265" y="125" width="175" height="78" rx="7" class="node"/><text x="352.5" y="154" class="label" text-anchor="middle">生成AI</text><text x="352.5" y="180" class="label" text-anchor="middle">ファイルを個別に渡す</text><text x="240" y="242" class="small" text-anchor="middle">課題：多数のファイルの提供に手間</text><path d="M24 280H456" class="outline"/><text x="30" y="325" class="label" text-anchor="start">方式2｜Python統合【不採用】</text><path d="M30 355h30l12 12
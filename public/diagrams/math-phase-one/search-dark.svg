<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t d"><title id="t">候補を作ることと選ぶこと</title><desc id="d">生成予算 → 複数候補。候補中に正解が存在するか。検証予算 → 採用する候補。選択後の正しさを評価</desc><rect width="480" height="480" fill="#192a2c"/><g font-family="system-ui,sans-serif" fill="#e4f1eb"><text x="24" y="40" font-size="23" font-weight="700">候補を作ることと選ぶこと</text><rect x="24" y="66" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="105" text-anchor="middle" font-size="22">生成予算 → 複数候補</text><path d="M240 134v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="161" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="22">候補中に正解が存在するか</text><path d="M240 229v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="256" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="295" text-anchor="middle" font-size="22">検証予算 → 採用する候補</text><path d="M240 324v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="351" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="390" text-anchor="middle" font-size="22">選択後の正しさを評価</text><text x="24" y="461" font-size="18">式・前提との対応を示す模式図</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t desc"><title id="t">許容集合Aと受理集合C</title><desc id="desc">Aはaとb、Cはaとc。aは正しく受理、bは過剰拒否、cは誤受理、dは正しく拒否。CがAの部分集合とは限らない。</desc><rect width="480" height="480" fill="#192a2c"/><g font-family="system-ui,sans-serif" fill="#e4f1eb"><text x="24" y="40" font-size="23" font-weight="700">許容集合と受理集合を分ける</text><rect x="24" y="70" width="432" height="255" fill="#263d3e" stroke="#8db7a8"/><text x="36" y="98" font-size="18">全出力 Y</text><ellipse cx="187" cy="200" rx="115" ry="80" fill="none" stroke="#8db7a8" stroke-width="3"/><ellipse cx="300" cy="200" rx="115" ry="80" fill="none" stroke="#8db7a8" stroke-dasharray="7 4" stroke-width="3"/><text x="120" y="140" font-size="22">A</text><text x="345" y="140" font-size="22">C</text><text x="130" y="208" font-size="25">b</text><text x="237" y="208" font-size="25">a</text><text x="350" y="208" font-size="25">c</text><text x="420" y="300" font-size="25">d</text><text x="24" y="365" font-size="22">b：許容されるが拒否（過剰拒否）</text><text x="24" y="405" font-size="22">c：不許可だが受理（誤受理）</text><text x="24" y="453" font-size="18">健全性 C ⊆ A は別途確認が必要</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t d"><title id="t">学習と真偽の基準</title><desc id="d">訓練データの目標分布。最尤学習 → 予測分布。出力の主張と根拠を照合。採用判断は学習損失と別</desc><rect width="480" height="480" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#163d34"><text x="24" y="40" font-size="23" font-weight="700">学習と真偽の基準</text><rect x="24" y="66" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="105" text-anchor="middle" font-size="19">訓練データの目標分布</text><path d="M240 134v21m-6-6 6 6 6-6" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="161" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="19">最尤学習 → 予測分布</text><path d="M240 229v21m-6-6 6 6 6-6" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="256" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="295" text-anchor="middle" font-size="19">出力の主張と根拠を照合</text><path d="M240 324v21m-6-6 6 6 6-6" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="351" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="390" text-anchor="middle" font-size="19">採用判断は学習損失と別</text><text x="24" y="461" font-size="16">式・前提との対応を示す模式図</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t d"><title id="t">Attentionの情報の流れ</title><desc id="d">入力 X → Q・K・V。Q と K → スコア・マスク。行ごとの softmax → 重み。重み × V → 位置ごとの出力</desc><rect width="480" height="480" fill="#192a2c"/><g font-family="system-ui,sans-serif" fill="#e4f1eb"><text x="24" y="40" font-size="23" font-weight="700">Attentionの情報の流れ</text><rect x="24" y="66" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="105" text-anchor="middle" font-size="22">入力 X → Q・K・V</text><path d="M240 134v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="161" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="22">Q と K → スコア・マスク</text><path d="M240 229v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="256" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="295" text-anchor="middle" font-size="22">行ごとの softmax → 重み</text><path d="M240 324v21m-6-6 6 6 6-6" stroke="#8db7a8" stroke-width="2" fill="none"/><rect x="24" y="351" width="432" height="64" rx="10" fill="#263d3e" stroke="#8db7a8" stroke-width="2"/><text x="240" y="390" text-anchor="middle" font-size="22">重み × V → 位置ごとの出力</text><text x="24" y="461" font-size="18">式・前提との対応を示す模式図</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="t d"><title id="t">確率式と実装の範囲</title><desc id="d">連鎖律：系列確率を分解。自己回帰：順番にサンプリング。検索：決定的な結果を条件へ。周辺化：潜在文書を足し合わせる</desc><rect width="480" height="480" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#163d34"><text x="24" y="40" font-size="23" font-weight="700">確率式と実装の範囲</text><rect x="24" y="66" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="105" text-anchor="middle" font-size="19">連鎖律：系列確率を分解</text><rect x="24" y="161" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="19">自己回帰：順番にサンプリング</text><rect x="24" y="256" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="295" text-anchor="middle" font-size="19">検索：決定的な結果を条件へ</text><rect x="24" y="351" width="432" height="64" rx="10" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="390" text-anchor="middle" font-size="19">周辺化：潜在文書を足し合わせる</text><text x="24" y="461" font-size="16">式・前提との対応を示す模式図</text></g></svg>
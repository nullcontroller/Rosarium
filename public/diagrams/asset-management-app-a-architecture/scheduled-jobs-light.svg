<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">定期処理の追跡</title>
<desc id="desc">各段に要素または工程と、その役割を示す。</desc>
<rect width="480" height="600" rx="12" fill="#f7faf8"/>
<text x="24" y="32" fill="#405d4c" font-family="sans-serif" font-size="22">定期処理の追跡</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">対象日・未完了を読む</text>
<text x="240" y="115" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">永続化したジョブ状態</text>
<path d="M240 135 V147" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 142 L240 149 L245 142" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="156" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="186" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">実行条件を確認</text>
<text x="240" y="215" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">時刻・営業日・公表周期</text>
<path d="M240 235 V247" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 242 L240 249 L245 242" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="256" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="286" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">取得と検証</text>
<text x="240" y="315" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">外部通信は正本ロック外</text>
<path d="M240 335 V347" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 342 L240 349 L245 342" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="356" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="386" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">完了・待機を保存</text>
<text x="240" y="415" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">次回試行と対象を残す</text>
<path d="M240 435 V447" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 442 L240 449 L245 442" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="456" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="486" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">記録・次回の判定</text>
<text x="240" y="515" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">再起動後も状態を参照</text>
</svg>

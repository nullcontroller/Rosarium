<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">実績と予定の区分</title>
<desc id="desc">各段に要素または工程と、その役割を示す。</desc>
<rect width="480" height="600" rx="12" fill="#14221e"/>
<text x="24" y="32" fill="#c5d8cd" font-family="sans-serif" font-size="22">実績と予定の区分</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">保有数量 × 単位付き価格</text>
<text x="240" y="115" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">まず実評価額を求める</text>
<path d="M60 154.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="176" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="206" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">実績と予定を分離</text>
<text x="240" y="235" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">未実現予定は実績から除く</text>
<path d="M60 274.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="296" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="326" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">目標と実績を比較</text>
<text x="240" y="355" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">同じ分母で差を評価</text>
<path d="M60 394.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="416" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="446" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">予測とストレスを分離</text>
<text x="240" y="475" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">年次更新と単年ショック</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 630" width="440" height="630" role="img" aria-labelledby="title desc"><title id="title">三者の責任と確認対象</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94bfb6"/></marker></defs><rect width="440" height="630" rx="12" fill="#122426"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#e1eceb">三者の責任と確認対象</text><rect x="30" y="55" width="380" height="146" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="86" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">人間</text><text x="220" y="116" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">目的・制約・重要な意思決定</text><text x="220" y="143" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">動作確認環境で実操作・評価</text><text x="220" y="170" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">最終承認と最終責任</text><rect x="30" y="235" width="380" height="146" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="266" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">ChatGPT</text><text x="220" y="296" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">要求整理・設計・実装指示</text><text x="220" y="323" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">レビューZIPの確認・品質レビュー</text><text x="220" y="350" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">改善方針・修正指示</text><rect x="30" y="415" width="380" height="146" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="446" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">Codex</text><text x="220" y="476" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">実装・テスト・修正</text><text x="220" y="503" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">レビューZIP・動作確認環境を用意</text><text x="220" y="530" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">リファクタリング</text><text x="220" y="604" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">最終承認と責任は人間に残す</text></g></svg>

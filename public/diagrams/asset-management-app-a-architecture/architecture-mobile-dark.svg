<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1530" viewBox="0 0 480 1530" role="img" aria-labelledby="title desc"><title id="title">資産管理アプリAのシステム全体構成</title><desc id="desc">端末はTailscale経由でWindows PCのアプリへ接続する。金融データの正本はPCが保持し、Google Driveは100MB以内のソース管理に使用する。夜間に価格を取得し、月末には外付けHDDへバックアップする。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#92d5c1"/></marker></defs><rect width="480" height="1530" rx="12" fill="#1c282c"/><g font-family="'Yu Gothic UI','Yu Gothic',system-ui,sans-serif"><text x="24" y="42" font-size="28" font-weight="700" fill="#92d5c1">資産管理アプリA</text>
<rect x="20" y="72" width="440" height="150" rx="10" fill="#1c282c" stroke="#3c5052" stroke-width="1.5"/>

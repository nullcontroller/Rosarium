<text x="42" y="1338" font-size="23" font-weight="400" fill="#e3ece8">夜間の価格取得／月末バックアップ</text>
<text x="42" y="1372" font-size="23" font-weight="400" fill="#e3ece8">変動額が未入力なら月末に通知</text>
<text x="24" y="1480" font-size="23" font-weight="400" fill="#a6b9ba">利用条件：PCの稼働・ネットワーク接続</text></g></svg>

<path transform="translate(38 650)" d="M16 2a14 14 0 1 0 0 28 14 14 0 0 0 0-28 M2 16h28 M16 2c-9 8-9 20 0 28 M16 2c9 8 9 20 0 28" fill="none" stroke="#92d5c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="675" font-size="24" font-weight="600" fill="#e3ece8">外部市場情報</text>

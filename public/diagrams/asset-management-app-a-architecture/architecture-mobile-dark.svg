<text x="42" y="390" font-size="28" font-weight="700" fill="#e3ece8">資産管理アプリA</text>
<text x="42" y="428" font-size="24" font-weight="400" fill="#e3ece8">Python Webアプリケーション</text>
<text x="42" y="473" font-size="24" font-weight="400" fill="#e3ece8">資産評価・集計／収支管理</text>
<text x="42" y="507" font-size="24" font-weight="400" fill="#e3ece8">データ保存／自動処理</text>

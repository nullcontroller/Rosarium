<text x="36" y="255" font-size="24" font-weight="400" fill="#92d5c1">Tailscale経由の非公開アクセス</text>
<rect x="20" y="304" width="440" height="286" rx="10" fill="#263c38" stroke="#92d5c1" stroke-width="2.5"/>
<path transform="translate(38 322)" d="M2 3h28v19H2z M16 22v7 M8 29h16" fill="none" stroke="#92d5c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

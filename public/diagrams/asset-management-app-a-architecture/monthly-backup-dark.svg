<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">月末バックアップ</title>
<desc id="desc">業務上の役割と設計判断を整理する。</desc>
<rect width="480" height="600" rx="12" fill="#14221e"/>
<text x="24" y="32" fill="#c5d8cd" font-family="sans-serif" font-size="22">月末バックアップ</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">月末の記録を保存</text>
<text x="240" y="115" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">バックアップを開始</text>
<path d="M240 135 V167" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 162 L240 169 L245 162" fill="none" stroke="#9ad1ad"/>
<rect x="20" y="176" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="206" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">保存内容を検証</text>
<text x="240" y="235" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">失敗時は既存分を保持</text>
<path d="M240 255 V287" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 282 L240 289 L245 282" fill="none" stroke="#9ad1ad"/>
<rect x="20" y="296" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="326" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">外付けHDDへ保存</text>
<text x="240" y="355" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">未接続時は退避・再試行</text>
<path d="M240 375 V407" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 402 L240 409 L245 402" fill="none" stroke="#9ad1ad"/>
<rect x="20" y="416" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="446" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">成功後に古い分を削除</text>
<text x="240" y="475" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">最新3回分を保持</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">外部バックアップ</title>
<desc id="desc">各段に要素または工程と、その役割を示す。</desc>
<rect width="480" height="600" rx="12" fill="#14221e"/>
<text x="24" y="32" fill="#c5d8cd" font-family="sans-serif" font-size="22">外部バックアップ</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">確定世代からZIP作成</text>
<text x="240" y="115" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">ローカル一時退避</text>
<path d="M240 135 V167" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 162 L240 169 L245 162" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<rect x="20" y="176" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="206" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">CRC・ハッシュ・内容検証</text>
<text x="240" y="235" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">未接続時は状態を残し再試行</text>
<path d="M240 255 V287" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 282 L240 289 L245 282" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<rect x="20" y="296" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="326" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">外部媒体へ保存・読戻し</text>
<text x="240" y="355" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">正式名への確定後に成功</text>
<path d="M240 375 V407" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<path d="M235 402 L240 409 L245 402" fill="none" stroke="#9ad1ad" stroke-width="2"/>
<rect x="20" y="416" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="446" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">成功後に世代整理</text>
<text x="240" y="475" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">新方式の検証済み最新3世代</text>
</svg>

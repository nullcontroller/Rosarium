<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">正本の復元</title>
<desc id="desc">各段に要素または工程と、その役割を示す。</desc>
<rect width="480" height="600" rx="12" fill="#f7faf8"/>
<text x="24" y="32" fill="#405d4c" font-family="sans-serif" font-size="22">正本の復元</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">利用者の確認・revision</text>
<text x="240" y="115" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">復元対象を検証</text>
<path d="M240 135 V167" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 162 L240 169 L245 162" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="176" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="206" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">現行の正本を保護</text>
<text x="240" y="235" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">まず保護コピーを作る</text>
<path d="M240 255 V287" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 282 L240 289 L245 282" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="296" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="326" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">ZIPと内容を再検証</text>
<text x="240" y="355" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">接続設定は無条件に適用しない</text>
<path d="M240 375 V407" fill="none" stroke="#326448" stroke-width="2"/>
<path d="M235 402 L240 409 L245 402" fill="none" stroke="#326448" stroke-width="2"/>
<rect x="20" y="416" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="446" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">新世代として復元</text>
<text x="240" y="475" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">過去ファイルの単純上書きにしない</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">論理データモデル</title>
<desc id="desc">各段に要素または工程と、その役割を示す。</desc>
<rect width="480" height="600" rx="12" fill="#14221e"/>
<text x="24" y="32" fill="#c5d8cd" font-family="sans-serif" font-size="22">論理データモデル</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">保有明細と資産</text>
<text x="240" y="115" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">識別子・数量・価格単位</text>
<path d="M60 144.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="156" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="186" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">価格・現金・目標・予定</text>
<text x="240" y="215" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">異なる意味のモデル</text>
<path d="M60 244.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="256" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="286" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">日次・月次の確定履歴</text>
<text x="240" y="315" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">元世代とデータ時点</text>
<path d="M60 344.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="356" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="386" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">予測設定／ストレス設定</text>
<text x="240" y="415" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">別の問いを別に保存</text>
<path d="M60 444.0 H420" fill="none" stroke="#9ad1ad" stroke-dasharray="3 5"/>
<rect x="20" y="456" width="440" height="76" rx="9" fill="#20392f" stroke="#9ad1ad" stroke-width="2"/>
<text x="240" y="486" text-anchor="middle" fill="#edf5ef" font-family="sans-serif" font-size="24" font-weight="600">ランタイム状態は別領域</text>
<text x="240" y="515" text-anchor="middle" fill="#c5d8cd" font-family="sans-serif" font-size="22">ジョブ進行・診断ログ</text>
</svg>

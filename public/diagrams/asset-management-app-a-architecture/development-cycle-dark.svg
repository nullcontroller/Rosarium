<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1035" width="440" height="1035" role="img" aria-labelledby="title desc"><title id="title">開発サイクルと役割分担</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94bfb6"/></marker></defs><rect width="440" height="1035" rx="12" fill="#122426"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#e1eceb">開発サイクルと役割分担</text><rect x="30" y="55" width="380" height="80" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="86" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">課題発見・改善要求</text><text x="220" y="116" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">人間</text><path d="M220 135V165" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="165" width="380" height="90" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">要求整理・実装指示</text><text x="220" y="226" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">ChatGPT</text><path d="M220 255V285" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="285" width="380" height="90" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="316" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">実装・テスト</text><text x="220" y="346" text-anchor="middle" font-size="22" font-weight="400" fill="#e1eceb">Codex</text><path d="M220 375V400" fill="none" stroke="#94bfb6" stroke-width="2"/><path d="M220 400H114V435" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 400H326V435" fill="none" stroke="#94bfb6" stroke-width="2" mark
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">月末の入力業務</title>
<desc id="desc">業務上の役割と設計判断を整理する。</desc>
<rect width="480" height="600" rx="12" fill="#f7faf8"/>
<text x="24" y="32" fill="#405d4c" font-family="sans-serif" font-size="22">月末の入力業務</text>
<rect x="20" y="56" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="86" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">固定額は事前登録</text>
<text x="240" y="115" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">繰り返し利用する情報</text>
<path d="M60 154 H420" fill="none" stroke="#326448" stroke-dasharray="3 5"/>
<rect x="20" y="176" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="206" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">変動額は月末入力</text>
<text x="240" y="235" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">その月の金額を利用者が確認</text>
<path d="M60 274 H420" fill="none" stroke="#326448" stroke-dasharray="3 5"/>
<rect x="20" y="296" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="326" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">未入力なら月末に通知</text>
<text x="240" y="355" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">月末にスマートフォンへ</text>
<path d="M60 394 H420" fill="none" stroke="#326448" stroke-dasharray="3 5"/>
<rect x="20" y="416" width="440" height="76" rx="9" fill="#edf4ee" stroke="#326448" stroke-width="2"/>
<text x="240" y="446" text-anchor="middle" fill="#18392b" font-family="sans-serif" font-size="24" font-weight="600">収支と資産状態を確認</text>
<text x="240" y="475" text-anchor="middle" fill="#405d4c" font-family="sans-serif" font-size="22">収入と利用金額の差額</text>
</svg>

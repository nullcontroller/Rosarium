<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">相関と介入の効果を分ける</title><desc id="desc">本文の条件に限定した模式図と人工計算例。実モデルの性能測定ではない。</desc><rect width="480" height="640" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="36" text-anchor="middle" fill="#163d34" font-size="23">相関と介入の効果を分ける</text><rect x="20" y="65" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="97" text-anchor="middle" fill="#163d34" font-size="22">観測では u = v</text><text x="240" y="129" text-anchor="middle" fill="#415d55" font-size="20">出力との相関は、どちらも 1</text><rect x="20" y="175" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="207" text-anchor="middle" fill="#163d34" font-size="22">人工 readout：M = 2u − 0.5</text><text x="240" y="239" text-anchor="middle" fill="#415d55" font-size="20">clean (1,1)：1.5 ／ corrupt (0,0)：−0.5</text><text x="240" y="300" text-anchor="middle" fill="#163d34" font-size="23">置換による回復比 R</text><text x="110" y="340" text-anchor="middle" fill="#163d34" font-size="21">u を置換</text><rect x="205" y="317" width="225" height="28" fill="#ffffff" stroke="#477d6c"/><rect x="205" y="317" width="225" height="28" fill="#477d6c"/><text x="315" y="375" text-anchor="middle" fill="#163d34" font-size="21">R = 1</text><text x="110" y="425" text-anchor="middle" fill="#163d34" font-size="21">v を置換</text><rect x="205" y="402" width="225" height="28" fill="#ffffff" stroke="#477d6c"/><text x="315" y="460" text-anchor="middle" fill="#163d34" font-size="21">R = 0</text><text x="240" y="535" text-anchor="middle" fill="#163d34" font-size="21">観測相関が同じでも効果は異なる</text><text x="240" y="573" text-anchor="middle" fill="#415d55" font-size="20">この人工因果グラフの条件に限る</text><text x="240" y="623" text-anchor="middle" fill="#415d55" font-size="18">説明用の模式図・人工例</text></g></svg>
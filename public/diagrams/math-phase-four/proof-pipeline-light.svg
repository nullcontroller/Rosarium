<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">生成と検査の責務を分ける</title><desc id="desc">本文の条件に限定した模式図と人工計算例。実モデルの性能測定ではない。</desc><rect width="480" height="640" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="36" text-anchor="middle" fill="#163d34" font-size="23">生成と検査の責務を分ける</text><rect x="20" y="60" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="92" text-anchor="middle" fill="#163d34" font-size="22">人間：問題と前提を形式化</text><text x="240" y="124" text-anchor="middle" fill="#415d55" font-size="20">現実の要求との対応を確認</text><text x="240" y="163" text-anchor="middle" fill="#477d6c" font-size="23">↓</text><rect x="20" y="168" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="200" text-anchor="middle" fill="#163d34" font-size="22">AI：証明候補を生成する</text><text x="240" y="232" text-anchor="middle" fill="#415d55" font-size="20">中間目標・規則の選択を提案</text><text x="240" y="271" text-anchor="middle" fill="#477d6c" font-size="23">↓</text><rect x="20" y="276" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="308" text-anchor="middle" fill="#163d34" font-size="22">記号的な検査器で確認する</text><text x="240" y="340" text-anchor="middle" fill="#415d55" font-size="20">構文・参照・規則・目標を照合</text><text x="240" y="379" text-anchor="middle" fill="#477d6c" font-size="23">↓</text><rect x="20" y="384" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="416" text-anchor="middle" fill="#163d34" font-size="22">不受理 → 候補を再検討</text><text x="240" y="448" text-anchor="middle" fill="#415d55" font-size="20">受理 → 指定体系での証明</text><text x="240" y="487" text-anchor="middle" fill="#477d6c" font-size="23">↓</text><rect x="20" y="492" width="440" height="84" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="524" text-anchor="middle" fill="#163d34" font-size="22">人間：保証の範囲を確認</text><text x="240" y="556" text-anchor="middle" fill="#415d55" font-size="20">前提・公理・検査実装への信頼</text><text x="240" y="623" text-anchor="middle" fill="#415d55" font-size="18">説明用の模式図・人工例</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">内部を観測し、介入で確かめる</title><desc id="desc">本文の条件に限定した模式図と人工計算例。実モデルの性能測定ではない。</desc><rect width="480" height="640" fill="#152326"/><g font-family="system-ui,sans-serif"><text x="240" y="36" text-anchor="middle" fill="#e2f0eb" font-size="23">内部を観測し、介入で確かめる</text><rect x="20" y="60" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="92" text-anchor="middle" fill="#e2f0eb" font-size="22">言語モデルの入力と出力</text><text x="240" y="124" text-anchor="middle" fill="#becfc9" font-size="20">例：首都を答える文脈</text><text x="240" y="163" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="168" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="200" text-anchor="middle" fill="#e2f0eb" font-size="22">活性化を観測する</text><text x="240" y="232" text-anchor="middle" fill="#becfc9" font-size="20">相関だけで原因とは決めない</text><text x="240" y="271" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="276" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="308" text-anchor="middle" fill="#e2f0eb" font-size="22">SAEで表現を近似する</text><text x="240" y="340" text-anchor="middle" fill="#becfc9" font-size="20">疎な特徴と再構成誤差を調べる</text><text x="240" y="379" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="384" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="416" text-anchor="middle" fill="#e2f0eb" font-size="22">成分を置換・除去する</text><text x="240" y="448" text-anchor="middle" fill="#becfc9" font-size="20">対照条件の出力変化を比較する</text><text x="240" y="487" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="492" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="524" text-anchor="middle" fill="#e2f0eb" font-size="22">条件付きの証拠を評価する</text><text x="240" y="556" text-anchor="middle" fill="#becfc9" font-size="20">全判断の完全な説明ではない</text><text x="240" y="623" text-anchor="middle" fill="#becfc9" font-size="18">説明用の模式図・人工例</text></g></svg>
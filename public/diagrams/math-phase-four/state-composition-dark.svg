<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">3状態を、入力順に更新する</title><desc id="desc">本文の条件に限定した模式図と人工計算例。実モデルの性能測定ではない。</desc><rect width="480" height="640" fill="#152326"/><g font-family="system-ui,sans-serif"><text x="240" y="36" text-anchor="middle" fill="#e2f0eb" font-size="23">3状態を、入力順に更新する</text><rect x="20" y="65" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="97" text-anchor="middle" fill="#e2f0eb" font-size="22">初期状態 0 ／ 入力 abba</text><text x="240" y="129" text-anchor="middle" fill="#becfc9" font-size="20">a：循環　b：0 と 1 を交換</text><text x="240" y="215" text-anchor="middle" fill="#e2f0eb" font-size="29">0 → 1 → 0 → 1 → 2</text><text x="240" y="255" text-anchor="middle" fill="#becfc9" font-size="22">a　　 b　　 b　　 a</text><rect x="20" y="300" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="332" text-anchor="middle" fill="#e2f0eb" font-size="22">直列に状態を更新</text><text x="240" y="364" text-anchor="middle" fill="#becfc9" font-size="20">前の状態から次へ：n 段</text><rect x="20" y="410" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="442" text-anchor="middle" fill="#e2f0eb" font-size="22">十分な並列資源で木状合成</text><text x="240" y="474" text-anchor="middle" fill="#becfc9" font-size="20">深さ O(log n) ／ 総演算 O(n)</text><text x="240" y="545" text-anchor="middle" fill="#e2f0eb" font-size="22">順序は交換できない</text><text x="240" y="580" text-anchor="middle" fill="#becfc9" font-size="22">ab → 0　／　ba → 2</text><text x="240" y="623" text-anchor="middle" fill="#becfc9" font-size="18">説明用の模式図・人工例</text></g></svg>
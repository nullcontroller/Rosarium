<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">既に得られた式から次へ進む</title><desc id="desc">本文の条件に限定した模式図と人工計算例。実モデルの性能測定ではない。</desc><rect width="480" height="640" fill="#152326"/><g font-family="system-ui,sans-serif"><text x="240" y="36" text-anchor="middle" fill="#e2f0eb" font-size="23">既に得られた式から次へ進む</text><rect x="20" y="60" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="92" text-anchor="middle" fill="#e2f0eb" font-size="22">前提 P と P → Q</text><text x="240" y="124" text-anchor="middle" fill="#becfc9" font-size="20">どちらも前提の一覧から引用</text><text x="240" y="163" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="168" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="200" text-anchor="middle" fill="#e2f0eb" font-size="22">モーダスポネンスを適用</text><text x="240" y="232" text-anchor="middle" fill="#becfc9" font-size="20">P と P → Q から Q を得る</text><text x="240" y="271" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="276" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="308" text-anchor="middle" fill="#e2f0eb" font-size="22">得られた Q と前提 Q → R</text><text x="240" y="340" text-anchor="middle" fill="#becfc9" font-size="20">以前の行だけを参照する</text><text x="240" y="379" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="384" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="416" text-anchor="middle" fill="#e2f0eb" font-size="22">もう一度、同じ規則を適用</text><text x="240" y="448" text-anchor="middle" fill="#becfc9" font-size="20">Q と Q → R から R を得る</text><text x="240" y="487" text-anchor="middle" fill="#9bcebc" font-size="23">↓</text><rect x="20" y="492" width="440" height="84" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="524" text-anchor="middle" fill="#e2f0eb" font-size="22">最後の式が目標 R と一致</text><text x="240" y="556" text-anchor="middle" fill="#becfc9" font-size="20">自然な文章だけでは受理しない</text><text x="240" y="623" text-anchor="middle" fill="#becfc9" font-size="18">説明用の模式図・人工例</text></g></svg>
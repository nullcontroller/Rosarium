<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">一入力の寄与はどう残るか</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="500" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#163d34">一入力の寄与はどう残るか</text><polyline points="45,115.0 93,232.5 141,291.25 189,320.625 237,335.3125 285,342.65625 333,346.328125 381,348.1640625 429,349.08203125" stroke="#477d6c" stroke-width="3" fill="none"/><text x="240" y="65" text-anchor="middle" font-size="20" fill="#163d34">a=0.5 実線</text><polyline points="45,115.0 93,138.5 141,159.64999999999998 189,178.68499999999997 237,195.8165 285,211.23485 333,225.11136499999998 381,237.6002285 429,248.84020564999997" stroke="#415d55" stroke-width="3" fill="none" stroke-dasharray="9 5"/><text x="240" y="93" text-anchor="middle" font-size="20" fill="#163d34">a=0.9 破線</text><polyline points="45,115.0 93,185.5 141,225.45 189,249.65499999999997 237,265.5645 285,276.94555 333,285.719745 381,292.8821455 429,298.96111844999996" stroke="#163d34" stroke-width="2" stroke-dasharray="2 5" fill="none"/><text x="240" y="118" text-anchor="middle" font-size="20" fill="#163d34">二状態の平均：点線</text><path d="M45 105V350H445" fill="none" stroke="#163d34"/><text x="240" y="388" text-anchor="middle" font-size="20" fill="#163d34">経過した位置差 ℓ：0 → 8</text><text x="240" y="424" text-anchor="middle" font-size="20" fill="#415d55">二状態では両方の減衰を保持できる</text><text x="240" y="485" text-anchor="middle" font-size="18" fill="#415d55">模式図・人工例 / 実測性能ではない</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">文章を確定する順序を変える</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="650" fill="#152326"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#e2f0eb">文章を確定する順序を変える</text><rect x="20" y="60" width="440" height="180" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="94" text-anchor="middle" font-size="23" fill="#e2f0eb">自己回帰：接頭辞から次へ</text><text x="240" y="135" text-anchor="middle" font-size="21" fill="#becfc9">猫 → 猫 が → 猫 が 眠る</text><text x="240" y="170" text-anchor="middle" font-size="21" fill="#becfc9">左から確定し、次の条件へ戻す</text><text x="240" y="205" text-anchor="middle" font-size="21" fill="#becfc9">逐次依存を持つ生成</text><rect x="20" y="270" width="440" height="225" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="304" text-anchor="middle" font-size="23" fill="#e2f0eb">マスク型：未確定位置を復元</text><text x="240" y="345" text-anchor="middle" font-size="21" fill="#becfc9">[M] [M] [M] → 猫 [M] [M]</text><text x="240" y="380" text-anchor="middle" font-size="21" fill="#becfc9">→ 猫 が 眠る（模式例）</text><text x="240" y="415" text-anchor="middle" font-size="21" fill="#becfc9">学習：壊した文から内容を予測</text><text x="240" y="450" text-anchor="middle" font-size="21" fill="#becfc9">生成：復元器を反復して使う</text><text x="240" y="550" text-anchor="middle" font-size="21" fill="#e2f0eb">並列更新できる ≠ 必ず高速</text><text x="240" y="585" text-anchor="middle" font-size="21" fill="#becfc9">更新回数 × 一回の計算費用も比較</text><text x="240" y="635" text-anchor="middle" font-size="18" fill="#becfc9">模式図・人工例 / 実測性能ではない</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">同じFFNか、選んだExpertか</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="650" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#163d34">同じFFNか、選んだExpertか</text><rect x="20" y="60" width="440" height="150" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="94" text-anchor="middle" font-size="23" fill="#163d34">Dense：共通のFFN</text><text x="240" y="135" text-anchor="middle" font-size="21" fill="#415d55">全トークン → 同じFFN → 出力</text><text x="240" y="170" text-anchor="middle" font-size="21" fill="#415d55">比較対象を固定して費用を数える</text><rect x="20" y="240" width="440" height="305" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="274" text-anchor="middle" font-size="23" fill="#163d34">MoE：一部のExpertを選ぶ</text><text x="240" y="315" text-anchor="middle" font-size="21" fill="#415d55">入力 → Router → Top-k 選択</text><text x="240" y="350" text-anchor="middle" font-size="21" fill="#415d55">E0 ✓　E1 ✓　E2 −　E3 −</text><text x="240" y="385" text-anchor="middle" font-size="21" fill="#415d55">選択した2個だけを計算</text><text x="240" y="420" text-anchor="middle" font-size="21" fill="#415d55">→ 重み付き合成 → 出力</text><text x="240" y="455" text-anchor="middle" font-size="21" fill="#415d55">正規化の有無は方式で異なる</text><text x="240" y="590" text-anchor="middle" font-size="21" fill="#163d34">共通層・全重み保持・通信は残る</text><text x="240" y="635" text-anchor="middle" font-size="18" fill="#415d55">模式図・人工例 / 実測性能ではない</text></g></svg>
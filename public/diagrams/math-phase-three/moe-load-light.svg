<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">4トークンの割当を比較する</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="500" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#163d34">4トークンの割当を比較する</text><text x="240" y="70" text-anchor="middle" font-size="22" fill="#163d34">集中したTop-1</text><rect x="55" y="102" width="54" height="88" fill="#477d6c"/><text x="82" y="213" text-anchor="middle" font-size="19" fill="#163d34">E0: 4</text><rect x="160" y="190" width="54" height="1" fill="#477d6c"/><text x="187" y="213" text-anchor="middle" font-size="19" fill="#163d34">E1: 0</text><rect x="265" y="190" width="54" height="1" fill="#477d6c"/><text x="292" y="213" text-anchor="middle" font-size="19" fill="#163d34">E2: 0</text><rect x="370" y="190" width="54" height="1" fill="#477d6c"/><text x="397" y="213" text-anchor="middle" font-size="19" fill="#163d34">E3: 0</text><text x="240" y="265" text-anchor="middle" font-size="22" fill="#163d34">分散させた対照条件</text><rect x="55" y="363" width="54" height="22" fill="#477d6c"/><text x="82" y="408" text-anchor="middle" font-size="19" fill="#163d34">E0: 1</text><rect x="160" y="363" width="54" height="22" fill="#477d6c"/><text x="187" y="408" text-anchor="middle" font-size="19" fill="#163d34">E1: 1</text><rect x="265" y="363" width="54" height="22" fill="#477d6c"/><text x="292" y="408" text-anchor="middle" font-size="19" fill="#163d34">E2: 1</text><rect x="370" y="363" width="54" height="22" fill="#477d6c"/><text x="397" y="408" text-anchor="middle" font-size="19" fill="#163d34">E3: 1</text><text x="240" y="485" text-anchor="middle" font-size="18" fill="#415d55">模式図・人工例 / 実測性能ではない</text></g></svg>
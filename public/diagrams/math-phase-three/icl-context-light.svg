<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">例示を入力へ、重みは固定</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="650" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#163d34">例示を入力へ、重みは固定</text><rect x="20" y="60" width="440" height="87" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="93" text-anchor="middle" font-size="22" fill="#163d34">指示のみ → Zero-shot</text><text x="240" y="126" text-anchor="middle" font-size="20" fill="#415d55">例なしで回答の分布を計算</text><path d="M240 149v18m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="20" y="170" width="440" height="87" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="203" text-anchor="middle" font-size="22" fill="#163d34">指示＋一例 → One-shot</text><text x="240" y="236" text-anchor="middle" font-size="20" fill="#415d55">例：「楽しい → 肯定」</text><path d="M240 259v18m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="20" y="280" width="440" height="87" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="313" text-anchor="middle" font-size="22" fill="#163d34">指示＋少数例 → Few-shot</text><text x="240" y="346" text-anchor="middle" font-size="20" fill="#415d55">例の規則・形式を手掛かりに</text><path d="M240 369v18m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="20" y="390" width="440" height="87" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="423" text-anchor="middle" font-size="22" fill="#163d34">同じ重みで文脈を参照</text><text x="240" y="456" text-anchor="middle" font-size="20" fill="#415d55">Attention → 回答の分布</text><path d="M240 479v18m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="20" y="500" width="440" height="87" rx="8" fill="#fff" stroke="#477d6c" stroke-width="2"/><text x="240" y="533" text-anchor="middle" font-size="22" fill="#163d34">追加学習とは分ける</text><text x="240" y="566" text-anchor="middle" font-size="20" fill="#415d55">学習では損失から重みを更新</text><text x="240" y="635" text-anchor="middle" font-size="18" fill="#415d55">模式図・人工例 / 実測性能ではない</text></g></svg>
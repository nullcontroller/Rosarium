<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">例示で変わる、タスクAの確率</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="500" fill="#f5f9f7"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#163d34">例示で変わる、タスクAの確率</text><text x="28" y="90" text-anchor="start" font-size="22" fill="#163d34">0例：P(A) = 0.500</text><rect x="28" y="106" width="424" height="30" fill="#fff" stroke="#477d6c"/><rect x="28" y="106" width="212.0" height="30" fill="#477d6c"/><text x="28" y="168" text-anchor="start" font-size="20" fill="#415d55">次の回答1の確率 = 0.500</text><text x="28" y="205" text-anchor="start" font-size="22" fill="#163d34">1例：P(A) = 0.900</text><rect x="28" y="221" width="424" height="30" fill="#fff" stroke="#477d6c"/><rect x="28" y="221" width="381.6" height="30" fill="#477d6c"/><text x="28" y="283" text-anchor="start" font-size="20" fill="#415d55">次の回答1の確率 = 0.820</text><text x="28" y="320" text-anchor="start" font-size="22" fill="#163d34">2例：P(A) = 0.988</text><rect x="28" y="336" width="424" height="30" fill="#fff" stroke="#477d6c"/><rect x="28" y="336" width="418.8292682926829" height="30" fill="#477d6c"/><text x="28" y="398" text-anchor="start" font-size="20" fill="#415d55">次の回答1の確率 = 0.890</text><text x="240" y="485" text-anchor="middle" font-size="18" fill="#415d55">模式図・人工例 / 実測性能ではない</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">過去を参照するか、集約するか</title><desc id="desc">本文の条件を限定した説明図。実モデルの性能測定ではない。</desc><rect width="480" height="650" fill="#152326"/><g font-family="system-ui,sans-serif"><text x="240" y="35" text-anchor="middle" font-size="23" fill="#e2f0eb">過去を参照するか、集約するか</text><rect x="20" y="60" width="440" height="180" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="94" text-anchor="middle" font-size="23" fill="#e2f0eb">Attention：過去を参照</text><text x="240" y="135" text-anchor="middle" font-size="21" fill="#becfc9">現在のQuery → 過去のKey/Value</text><text x="240" y="170" text-anchor="middle" font-size="21" fill="#becfc9">参照の重み → 値の集約 → 出力</text><text x="240" y="205" text-anchor="middle" font-size="21" fill="#becfc9">生成中は過去のKVを保持する</text><rect x="20" y="270" width="440" height="225" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="304" text-anchor="middle" font-size="23" fill="#e2f0eb">SSM：状態を更新</text><text x="240" y="345" text-anchor="middle" font-size="21" fill="#becfc9">入力 x ＋ 前状態 h → 次状態 h</text><text x="240" y="380" text-anchor="middle" font-size="21" fill="#becfc9">次状態から出力を読む</text><text x="240" y="415" text-anchor="middle" font-size="21" fill="#becfc9">履歴全体の原文保存ではない</text><text x="240" y="450" text-anchor="middle" font-size="21" fill="#becfc9">LTIなら固定の核へ展開できる</text><text x="240" y="550" text-anchor="middle" font-size="21" fill="#e2f0eb">Selective：入力で更新規則を変える</text><text x="240" y="585" text-anchor="middle" font-size="21" fill="#becfc9">一般には固定核を使い回せない</text><text x="240" y="635" text-anchor="middle" font-size="18" fill="#becfc9">模式図・人工例 / 実測性能ではない</text></g></svg>
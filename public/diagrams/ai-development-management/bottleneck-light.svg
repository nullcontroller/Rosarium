<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 864" width="440" height="864" role="img" aria-labelledby="title desc"><title id="title">判断をどこへ集めるか</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#416e62"/></marker></defs><rect width="440" height="864" rx="12" fill="#f7faf9"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#17383b">判断をどこへ集めるか</text><text x="220" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="#17383b">比較：人間が全作業を管理</text><rect x="30" y="91" width="380" height="80" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：作業指示</text><text x="220" y="152" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">次の作業を決めて指示</text><path d="M220 171V209" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="209" width="380" height="80" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">AI：実装・テスト</text><text x="220" y="270" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">実装が進んでも判断は残る</text><path d="M220 289V327" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="327" width="380" height="106" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="358" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：レビュー・修正判断</text><text x="220" y="388" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">通常管理と重要判断が集中</text><text x="220" y="415" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">判断待ちが生じ得る</text><text x="220" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#17383b">今回：通常管理をAIへ委任</text><rect x="30" y="500" width="380" height="80" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="531" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：目的・制約・重要判断</text><text x="220" y="561" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">委任範囲と承認条件を定める</text><path d="M220 580V618" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="618" width="380" height="106" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="649" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">AI：通常の開発管理と実装</text><text x="220" y="679" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">ChatGPT：要求・指示・レビュー</text><text x="220" y="706" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">Codex：実装・テスト・修正</text><path d="M220 724V762" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="762" width="380" height="80" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="793" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：最終承認</text><text x="220" y="823" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">最終責任は人間が保持</text></g></svg>

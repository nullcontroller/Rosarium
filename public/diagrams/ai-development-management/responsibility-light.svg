<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1150" width="440" height="1150" role="img" aria-labelledby="title desc"><title id="title">成果物で分ける二つのレビュー経路</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#416e62"/></marker></defs><rect width="440" height="1150" rx="12" fill="#f7faf9"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#17383b">成果物で分ける二つのレビュー経路</text><rect x="30" y="50" width="380" height="106" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="81" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：目的と制約</text><text x="220" y="111" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">目的設定・制約条件</text><text x="220" y="138" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">重要な意思決定</text><path d="M220 156V198" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="198" width="380" height="106" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="229" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">ChatGPT：開発管理</text><text x="220" y="259" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">要求整理・設計・改善方針</text><text x="220" y="286" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">Codexへの作業指示を作成</text><path d="M220 304V350" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="350" width="380" height="106" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="381" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">Codex：実装と検証</text><text x="220" y="411" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">実装・テスト・修正</text><text x="220" y="438" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">二つの成果物を用意</text><path d="M220 456V477H16V758H30" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M16 576H30" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="492" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">成果物を役割に合わせて分ける</text><rect x="30" y="510" width="380" height="132" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="541" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">レビューZIP → ChatGPT</text><text x="220" y="571" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">実装結果・検証資料を確認</text><text x="220" y="598" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">要求・設計・実装・品質を評価</text><text x="220" y="625" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">検証結果から修正点を整理</text><rect x="30" y="692" width="380" height="132" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="723" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">ステージング → 人間</text><text x="220" y="753" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">実際のシステムを操作</text><text x="220" y="780" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">要求・操作性・実用性を確認</text><text x="220" y="807" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">改善が必要かを判断</text><path d="M410 576H428V920H410" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 758H418V960H410" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="885" width="380" height="110" rx="8" fill="#f6edda" stroke="#416e62" stroke-width="2" /><text x="220" y="916" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">改善判断・修正指示</text><text x="220" y="946" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">ChatGPT：両者の結果を整理</text><text x="220" y="973" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">修正指示をCodexへ戻す</text><path d="M30 940H8V403H30" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 995V1040" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="1040" width="380" height="86" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="1071" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：最終承認</text><text x="220" y="1101" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">最終責任は人間が保持</text></g></svg>

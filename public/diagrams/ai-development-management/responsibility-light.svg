<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 716" width="440" height="716" role="img" aria-labelledby="title desc"><title id="title">人間・ChatGPT・Codexの責任分界</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#416e62"/></marker></defs><rect width="440" height="716" rx="12" fill="#f7faf9"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#17383b">人間・ChatGPT・Codexの責任分界</text><rect x="30" y="50" width="380" height="118" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="81" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：目的と制約</text><text x="220" y="111" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">目的設定・制約条件</text><text x="220" y="138" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">重要な意思決定</text><path d="M220 168V225" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="203" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">委任する範囲を定める</text><rect x="30" y="225" width="380" height="120" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="256" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">ChatGPT：開発管理</text><text x="220" y="286" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">要求整理・設計・改善方針</text><text x="220" y="313" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">作業指示の作成・品質レビュー</text><path d="M220 345V410" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="384" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">作業指示</text><rect x="30" y="410" width="380" height="146" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="441" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">Codex：実装と検証</text><text x="220" y="471" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">実装・テスト</text><text x="220" y="498" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">修正・リファクタリング</text><text x="220" y="525" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">成果物をレビューへ戻す</text><path d="M410 480H426V285H410" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 556V610" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="590" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">成果物とレビュー結果</text><rect x="30" y="610" width="380" height="82" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="641" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">人間：最終的な受入評価</text><text x="220" y="671" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">目的・制約に照らして承認</text></g></svg>

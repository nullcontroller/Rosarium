<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1330" width="440" height="1330" role="img" aria-labelledby="title desc"><title id="title">実利用・二つのレビュー・再検証</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94bfb6"/></marker></defs><rect width="440" height="1330" rx="12" fill="#122426"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#e1eceb">実利用・二つのレビュー・再検証</text><rect x="30" y="50" width="380" height="78" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="81" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">実利用</text><text x="220" y="111" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">アプリを使う</text><path d="M220 128V164" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="164" width="380" height="78" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">課題発見</text><text x="220" y="225" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">問題点・改善点を見つける</text><path d="M220 242V278" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="278" width="380" height="78" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="309" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">要求整理</text><text x="220" y="339" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">ChatGPT：変更する内容を整理</text><path d="M220 356V392" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="392" width="380" height="78" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="423" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">実装指示</text><text x="220" y="453" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">ChatGPT：作業指示を作成</text><path d="M220 470V506" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="506" width="380" height="106" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="537" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">Codex：実装・テスト</text><text x="220" y="567" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">レビューZIPに結果をまとめる</text><text x="220" y="594" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">ステージングへ反映</text><path d="M220 612V638H18V873H30" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><path d="M18 723H30" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="670" width="380" height="106" rx="8" fill="#244743" stroke="#94bfb6" stroke-width="3" /><text x="220" y="701" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">レビューZIP → ChatGPT</text><text x="220" y="731" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">要求・設計・実装・品質</text><text x="220" y="758" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">検証結果を確認</text><rect x="30" y="820" width="380" height="106" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="851" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">ステージング → 人間</text><text x="220" y="881" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">実操作で要求充足を確認</text><text x="220" y="908" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">操作性・実用上の改善を評価</text><path d="M410 723H428V1015H410" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 873H418V1050H410" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="980" width="380" height="106" rx="8" fill="#39372c" stroke="#94bfb6" stroke-width="2" /><text x="220" y="1011" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">改善判断・修正指示</text><text x="220" y="1041" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">双方のレビュー結果を反映</text><text x="220" y="1068" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">必要に応じてCodexへ差し戻す</text><path d="M30 1033H12V559H30" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 1086V1140" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="1140" width="380" height="78" rx="18" fill="#20333d" stroke="#94bfb6" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="1171" text-anchor="middle" font-size="23" font-weight="700" fill="#e1eceb">人間：最終承認</text><text x="220" y="1201" text-anchor="middle" font-size="20" font-weight="400" fill="#e1eceb">要求に照らして受入れを判断</text><path d="M30 1179H6V89H30" fill="none" stroke="#94bfb6" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="1258" text-anchor="middle" font-size="18" font-weight="400" fill="#e1eceb">修正は再実装・再検証へ戻す</text><text x="220" y="1286" text-anchor="middle" font-size="18" font-weight="400" fill="#e1eceb">要求変更は要求整理へ戻す</text><text x="220" y="1314" text-anchor="middle" font-size="18" font-weight="400" fill="#e1eceb">承認後は実利用へ戻り、再び改善</text></g></svg>

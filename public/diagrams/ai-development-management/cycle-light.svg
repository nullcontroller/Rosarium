<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1004" width="440" height="1004" role="img" aria-labelledby="title desc"><title id="title">実利用から次の改善へ戻す</title><desc id="desc">開発プロセスを説明する概念図。実測値や自律的な通信の実装を表さない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#416e62"/></marker></defs><rect width="440" height="1004" rx="12" fill="#f7faf9"/><g font-family="system-ui, sans-serif"><text x="220" y="29" text-anchor="middle" font-size="21" font-weight="700" fill="#17383b">実利用から次の改善へ戻す</text><rect x="30" y="50" width="380" height="78" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="81" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">実利用</text><text x="220" y="111" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">アプリを使う</text><path d="M220 128V164" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="164" width="380" height="78" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="195" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">課題発見</text><text x="220" y="225" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">問題点・改善点を見つける</text><path d="M220 242V278" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="278" width="380" height="78" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="309" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">要求整理</text><text x="220" y="339" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">ChatGPT：変更する内容を整理</text><path d="M220 356V392" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="392" width="380" height="78" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="423" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">実装指示</text><text x="220" y="453" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">ChatGPT：作業指示を作成</text><path d="M220 470V506" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="506" width="380" height="78" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="537" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">実装・テスト</text><text x="220" y="567" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">Codex：実装と検証</text><path d="M220 584V620" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="620" width="380" height="78" rx="8" fill="#f6edda" stroke="#416e62" stroke-width="2" /><text x="220" y="651" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">レビュー</text><text x="220" y="681" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">ChatGPT：結果と改善点を確認</text><path d="M220 698V734" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="734" width="380" height="78" rx="8" fill="#e0eee9" stroke="#416e62" stroke-width="3" /><text x="220" y="765" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">改善</text><text x="220" y="795" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">Codex：必要な修正を反映</text><path d="M220 812V848" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="848" width="380" height="78" rx="18" fill="#edf1f6" stroke="#416e62" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="879" text-anchor="middle" font-size="23" font-weight="700" fill="#17383b">受入れ</text><text x="220" y="909" text-anchor="middle" font-size="20" font-weight="400" fill="#17383b">人間：最終的な評価</text><path d="M410 659H428V545H410" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M30 659H12V317H30" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><path d="M30 887H22V89H30" fill="none" stroke="#416e62" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="959" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">修正は実装へ、要求変更は要求整理へ</text><text x="220" y="986" text-anchor="middle" font-size="18" font-weight="400" fill="#17383b">受入れ後は実利用へ戻り、再び改善</text></g></svg>

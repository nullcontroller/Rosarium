<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">LLMの学習と利用へ予算を配る</title><desc id="desc">本文のAI処理と数式の対応を示す人工的な説明図。特定製品の実装図や実測ではない。</desc><rect width="480" height="640" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#163d34"><text x="240" y="36" text-anchor="middle" font-size="23">LLMの学習と利用へ予算を配る</text><rect x="24" y="60" width="432" height="85" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="92" text-anchor="middle" font-size="22">学習前：規模と読む量を選ぶ</text><text x="240" y="122" text-anchor="middle" font-size="21" fill="#415d55">重みの数 N ／ トークン数 D</text><path d="M240 147V165m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="168" width="432" height="85" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="22">学習：予測・損失・重み更新</text><text x="240" y="230" text-anchor="middle" font-size="21" fill="#415d55">予算 C ≈ κND の下で反復</text><path d="M240 255V273m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="276" width="432" height="85" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="308" text-anchor="middle" font-size="22">同じ条件で予測損失を比較</text><text x="240" y="338" text-anchor="middle" font-size="21" fill="#415d55">経験式 L(N,D) で配分を検討</text><path d="M240 363V381m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="384" width="432" height="85" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="416" text-anchor="middle" font-size="22">利用：重みを固定して生成</text><text x="240" y="446" text-anchor="middle" font-size="21" fill="#415d55">推論トークン需要 U に費用</text><path d="M240 471V489m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="492" width="432" height="85" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240" y="524" text-anchor="middle" font-size="22">総費用まで含めて選び直す</text><text x="240" y="554" text-anchor="middle" font-size="21" fill="#415d55">低い損失 ≠ 能力の保証</text><text x="240" y="624" text-anchor="middle" font-size="20" fill="#415d55">対応を理解する模式図・実測ではない</text></g></svg>
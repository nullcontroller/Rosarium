<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">回答を作る処理と学習の更新</title><desc id="desc">本文のAI処理と数式の対応を示す人工的な説明図。特定製品の実装図や実測ではない。</desc><rect width="480" height="640" fill="#152326"/><g font-family="system-ui,sans-serif" fill="#e2f0eb"><text x="240" y="36" text-anchor="middle" font-size="23">回答を作る処理と学習の更新</text><rect x="24" y="60" width="432" height="85" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="92" text-anchor="middle" font-size="22">入力と接頭辞を状態へ</text><text x="240" y="122" text-anchor="middle" font-size="21" fill="#becfc9">例：入力「2+3は？」</text><path d="M240 147V165m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="168" width="432" height="85" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="200" text-anchor="middle" font-size="22">方策から次トークンを選ぶ</text><text x="240" y="230" text-anchor="middle" font-size="21" fill="#becfc9">モデルの重み → 選択確率</text><path d="M240 255V273m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="276" width="432" height="85" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="308" text-anchor="middle" font-size="22">回答が完了したら採点</text><text x="240" y="338" text-anchor="middle" font-size="21" fill="#becfc9">「5」→ 1 ／「6」→ 0</text><path d="M240 363V381m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="384" width="432" height="85" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="416" text-anchor="middle" font-size="22">報酬と対数確率の勾配</text><text x="240" y="446" text-anchor="middle" font-size="21" fill="#becfc9">期待報酬の更新方向を推定</text><path d="M240 471V489m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="492" width="432" height="85" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240" y="524" text-anchor="middle" font-size="22">学習工程で重みを更新</text><text x="240" y="554" text-anchor="middle" font-size="21" fill="#becfc9">次の生成の確率が変わる</text><text x="240" y="624" text-anchor="middle" font-size="20" fill="#becfc9">対応を理解する模式図・実測ではない</text></g></svg>
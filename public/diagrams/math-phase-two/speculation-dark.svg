<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">投機的復号の受理と補正</title><desc id="desc">説明用の模式図。本文の定義と成立条件を参照。</desc><rect width="480" height="650" fill="#152326"/><g font-family="system-ui,sans-serif" fill="#e2f0eb"><text x="240" y="36" text-anchor="middle" font-size="24">受理と補正で分布を保存</text><rect x="24" y="60" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="103.0" text-anchor="middle" font-size="22">Draft 分布 q → 提案 x</text><path d="M240 132V159m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="163" width="432" height="100" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="208.0" text-anchor="middle" font-size="22">Target p と比較</text><text x="240.0" y="235.0" text-anchor="middle" font-size="22">a(x) = min(1, p(x) / q(x))</text><text x="126" y="300" text-anchor="middle" font-size="22">受理</text><text x="353" y="300" text-anchor="middle" font-size="22">棄却</text><rect x="20" y="321" width="210" height="100" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="125.0" y="366.0" text-anchor="middle" font-size="22">提案 x を</text><text x="125.0" y="393.0" text-anchor="middle" font-size="22">そのまま採用</text><rect x="250" y="321" width="210" height="100" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="355.0" y="366.0" text-anchor="middle" font-size="22">不足 (p − q)₊</text><text x="355.0" y="393.0" text-anchor="middle" font-size="22">から引き直す</text><path d="M125 423V468m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><path d="M355 423V468m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="480" width="432" height="100" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="525.0" text-anchor="middle" font-size="22">受理質量 ＋ 補正質量 = p</text><text x="240.0" y="552.0" text-anchor="middle" font-size="22">棄却後の提案接頭辞は捨てる</text><text x="240" y="625" text-anchor="middle" font-size="20" fill="#becfc9">分布の一致 ≠ 同一シードの出力一致</text></g></svg>
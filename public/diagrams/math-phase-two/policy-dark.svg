<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">報酬から方策更新へ</title><desc id="desc">説明用の模式図。本文の定義と成立条件を参照。</desc><rect width="480" height="560" fill="#152326"/><g font-family="system-ui,sans-serif" fill="#e2f0eb"><text x="240" y="35" text-anchor="middle" font-size="24">報酬から方策更新へ</text><rect x="24" y="57" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="100.0" text-anchor="middle" font-size="22">方策 π から行動を生成</text><path d="M240 129V148m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="151" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="194.0" text-anchor="middle" font-size="22">収益 G − 基準 b</text><path d="M240 223V242m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="245" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="288.0" text-anchor="middle" font-size="22">score ∇ log π と掛ける</text><path d="M240 317V336m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="339" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="382.0" text-anchor="middle" font-size="22">標本平均で方策を更新</text><path d="M240 411V430m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="24" y="433" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="476.0" text-anchor="middle" font-size="22">独立に目的・挙動を評価</text><text x="240" y="548" text-anchor="middle" font-size="19" fill="#becfc9">実モデルの性能測定ではない</text></g></svg>
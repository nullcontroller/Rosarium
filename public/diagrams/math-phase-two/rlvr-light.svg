<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">グループを使った報酬評価</title><desc id="desc">説明用の模式図。本文の定義と成立条件を参照。</desc><rect width="480" height="650" fill="#f5f9f7"/><g font-family="system-ui,sans-serif" fill="#163d34"><text x="240" y="35" text-anchor="middle" font-size="24">グループを使った報酬評価</text><rect x="24" y="57" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="100.0" text-anchor="middle" font-size="22">同じ問題 → G 個の回答</text><path d="M240 129V148m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="151" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="194.0" text-anchor="middle" font-size="22">検証器 v で報酬を計算</text><path d="M240 223V242m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="245" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="288.0" text-anchor="middle" font-size="22">平均・標準偏差で相対化</text><path d="M240 317V336m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="339" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="382.0" text-anchor="middle" font-size="22">分散 0 は明示的に処理</text><path d="M240 411V430m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="433" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="476.0" text-anchor="middle" font-size="22">クリップ項 ＋ 参照への KL</text><path d="M240 505V524m-6-7 6 7 6-7" stroke="#477d6c" stroke-width="2" fill="none"/><rect x="24" y="527" width="432" height="70" rx="8" fill="#ffffff" stroke="#477d6c" stroke-width="2"/><text x="240.0" y="570.0" text-anchor="middle" font-size="22">未使用の問題で評価</text><text x="240" y="638" text-anchor="middle" font-size="19" fill="#415d55">実モデルの性能測定ではない</text></g></svg
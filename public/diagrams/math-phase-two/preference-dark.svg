<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">RLHFとDPOの構造</title><desc id="desc">説明用の模式図。本文の定義と成立条件を参照。</desc><rect width="480" height="650" fill="#152326"/><g font-family="system-ui,sans-serif" fill="#e2f0eb"><text x="240" y="36" text-anchor="middle" font-size="24">同じ比較から、二つの学習経路</text><rect x="24" y="60" width="432" height="70" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="103.0" text-anchor="middle" font-size="22">入力 x と回答対 (勝ち・負け)</text><text x="130" y="170" text-anchor="middle" font-size="24">RLHF</text><text x="350" y="170" text-anchor="middle" font-size="24">DPO</text><rect x="20" y="195" width="210" height="95" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="125.0" y="237.5" text-anchor="middle" font-size="22">報酬モデルを</text><text x="125.0" y="264.5" text-anchor="middle" font-size="22">比較から学習</text><path d="M125 292V315m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="20" y="320" width="210" height="95" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="125.0" y="362.5" text-anchor="middle" font-size="22">生成を採点し</text><text x="125.0" y="389.5" text-anchor="middle" font-size="22">方策を更新</text><rect x="250" y="195" width="210" height="95" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="355.0" y="237.5" text-anchor="middle" font-size="22">方策と参照の</text><text x="355.0" y="264.5" text-anchor="middle" font-size="22">対数確率比</text><path d="M355 292V315m-6-7 6 7 6-7" stroke="#9bcebc" stroke-width="2" fill="none"/><rect x="250" y="320" width="210" height="95" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="355.0" y="362.5" text-anchor="middle" font-size="22">比較の損失を</text><text x="355.0" y="389.5" text-anchor="middle" font-size="22">直接最小化</text><rect x="24" y="470" width="432" height="100" rx="8" fill="#203438" stroke="#9bcebc" stroke-width="2"/><text x="240.0" y="515.0" text-anchor="middle" font-size="22">比較モデル・支持集合が前提</text><text x="240.0" y="542.0" text-anchor="middle" font-size="22">選好 ≠ 真偽・安全性</text><text x="240" y="625" text-anchor="middle" font-size="20" fill="#becfc9">学習経路が無条件に等価とは限らない</text></g></svg>